name: Set up the API toolchain
description: >-
  Node at the production minor version, pnpm at the version named by package.json (through corepack), the pnpm store
  restored from the cache, and the workspace installed from the frozen lockfile. Nothing of apps/ is built.
runs:
  using: composite
  steps:
    # Production runs Node v24.20.0 (/home/azureuser/shannon-ios-runtime, deploy/azure/README.md); keep the same major/minor.
    - uses: actions/setup-node@v5
      with:
        node-version: '24.20'
        package-manager-cache: false
    # corepack reads "packageManager": "pnpm@11.19.0" from package.json, the version the lockfile was written with.
    - name: Enable pnpm through corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable pnpm
        pnpm --version
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-node24.20-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-node24.20-
    - name: Install the workspace
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: pnpm install --frozen-lockfile --prefer-offline
