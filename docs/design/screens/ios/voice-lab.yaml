  - "OFFを標準とし、Releaseへ実験設定を持ち込まない"
improve:
  - "pitch、formant、RVCを同じ固定文と保存WAVで切り替える"
  - "pitchを10 cents、formantを0.1半音刻みで調整し、指を離した時に同じPCMを先頭から再生する"
  - "pitchのみの実通話適用と、約100 msのバッファを使うformantの固定PCM比較を明確に区別する"
  - "前処理時間とDSP遅延をpresetごとに表示する"
  - "未接続のLive処理を有効と誤表示せずOFFへ戻す"
do_not_change:
  - "Realtime APIのセッション生成、テキスト、発話スタイル、会話記録"
  - "許諾のない声モデルを読み込まない"
states:
