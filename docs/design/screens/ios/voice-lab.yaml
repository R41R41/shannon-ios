  conflict: "再生中の変更は停止後に新しいpresetを先頭から再生する"
  selection: "選択中presetをチェックとVoiceOver traitで示す"
  tuning: "調整中は数値を即時更新し、指を離すか明示再生した時だけDSP処理して先頭から聴かせる"
