schema_version: 1
screen_id: shannon-ios-body
platform: ios
baseline_commit: 87093b2
last_verified_at: 2026-10-05
verification_scope: "2026-10-05（A6・A7・embed 2026-10-04）: swift test（声で返すの条件を1つずつ外すと声もマイクも出ないこと、カメラの状態の決め方と撮っている間だけの「いま見ています」）、iOS Debug・Mac Debug。Simulator（iPhone 17、デザインプレビュー、機械の負荷が高い状態）で、向き合う表示にLive2Dの姿が大きく立つこと（読み込みに約57秒）、向き合う表示の中でページ内の顔を押してtouchとaskReactionが届くこと、水の光の目の向き合う表示（Dark）、カメラの状態『カメラ：切』（Simulatorにはカメラが無い）、シートの設定タイルの下の『カメラ：切』、設定 › すがた、『トークで姿を見る』で設定が閉じて向き合う表示になることを確認。表示の切り替えボタンの長押しメニュー、実際の指での触り心地、2本の指、声で返す、触れたときの返事の選択（デザインプレビューには声が無いので出ない）、実機は未確認。 2026-10-03: ページとの受け渡し（呼び出しの文字列、届いた知らせの読み取り、部位）、舞台の決まり（止める条件、読み込みの時間切れ、読み直しの回数、どの画面に出すか）、触れたことの送信（オフでは送らない、友人も一緒の扱い、送信中に届いた分、登録のやり直し）、声で返す時の受け渡しと最初の音声ターンへのreactionId、口の開きの計算をswift testで確認。iOS DebugとMac Debugのビルド。Simulator（iPhone 17、デザインプレビュー、機械の負荷が非常に高い状態）で、ページが読み込まれてreadyが届くこと、joyfulの顔を出す呼び出し、ページ内で顔を押してtouchとaskReactionが届くこと、全身・上半身・水の光の目、向き合う表示の舞台、音声会話の画面をLightとDarkで確認。実機、実際の指での触り心地、2本指の拡大と移動、声で返す（実サーバーの音声・マイク・通話への引き継ぎ）、口パクの実音声、空の会話の小さな姿、低電力モードと視差効果を減らす設定での見え方、裏から戻った後の描画、Dynamic Type、VoiceOver実読み上げ、Macでの表示は未確認"
user_job: "トークで、シャノンの姿と向き合って話す。水の光の目とLive2Dの姿を切り替え、Live2Dの姿にはその場で指で触れ、いまの気持ちとしていることをひと目で知る（2026-10-03 の決定: からだはトークの表示の 1 つ。別の画面は作らない。A6 で『からだ』の画面をたたんだ）"
primary_action: "トークの表示の切り替え（一覧 ⇄ 向き合う）。長押しで姿・映し方・位置を戻す"
preserve:
  - "既定は水の光の目。Live2Dの姿を選ばないかぎり、会話・向き合う表示・音声会話の見た目はこれまでどおり"
  - "タスクの行、メッセージのアバター、考え中の表示、シャノンのカードの小さな顔は、これまでの絵のまま"
  - "部屋を見る機能（アプリのカメラ）とは別。姿はカメラを使わない"
improve:
  - "『からだ』の画面、トークのツールバーの『からだ』（figure.stand）、設定の『からだを開く』は無い。トークの表示の切り替えボタンが、その役目"
  - "Live2Dの姿のとき、向き合う表示は、上に姿（大きく）、その下に『いま：〈気持ち〉・〈していること〉』の1行、その下にあなたの直前のひとことと返事、入力欄。水の光の目のときは、これまでの見た目のまま"
  - "姿の上の1本の指は、その場で姿に届く（頭をなでる、つつく、くすぐる、手をつなぐ）。2本の指でつまんで大きさ、2本の指で動かして位置を変える"
  - "表示の切り替えボタンは、押すと表示が替わる（これまでどおり）。長押しで、姿（水の光の目／Live2Dの姿）、Live2Dの姿のときは映し方（全身／上半身）と位置を戻す"
  - "設定 › すがた: 姿、映し方、位置を戻す、トークで姿を見る、体に起きたことをシャノンに伝える（既定はオフ。入切は設定にだけ置く）、触れたときの返事（文字で返す／声で返す）と説明"
  - "文字で返す: シャノンのひとことは姿の近くの吹き出しに数秒出し、VoiceOverに読み上げを知らせる。声では話さず、マイクも開かない"
  - "声で返す: トークの向き合う表示の姿が見えている間（トークが前にあり、向き合う表示で、上にシート・カバー・音声会話の画面・写真やファイルの選択が無い）だけ。加えて、からだの画面のときと同じ条件をすべて満たすとき（あなただけ、ほかに音を使っているものが無い、アプリが前面、伝える設定がオン、Live2Dの姿）に、吹き出しに加えて声で言い（口が動く）、そのあとサーバーが決めた秒数だけマイクを開く。返事があれば音声会話の画面へ移ってそのまま会話になる。返事がなければ何も残さず閉じる。マイクの許可がない時は声だけ。声が6秒以内に始まらない時、ほかの人がいる時（友人も一緒の後5分を含む）、通話・音声入力・シャノンからの電話・イヤホンでの読み上げの最中は、吹き出しだけ。表示を一覧へ替える、ほかの画面へ移る、上に何かが出る、アプリを離れる、文字で返すへ切り替える、伝える設定をオフにする、水の光の目にする、のどれでも、声もマイクもすぐ止まる"
  - "空の会話の小さな姿は、Live2Dの姿のときは押すと向き合う表示になる。音声会話の画面の姿には触れられない"
do_not_change:
  - "Live2Dのページ（apps/ios/Sources/ShannonAppCore/Live2D/embed/）の中身。更新はフォルダーごと差し替える（docs/live2d-embed.md）"
  - "サーバーへの登録は『触れられることだけを感じる体』（flags.touchOnly）。カメラの旗は送らず、presenceは読まない（docs/body-contract.md）"
states:
  loading: "Live2Dの姿を読み込む間は水の光の目を出し、『Live2Dの姿を読み込んでいます… 40%』のように進み具合を小さく示す"
  error: "読み込めない時は一度だけ読み直す（一度も表示できないまま2回失敗したら、そこで止める）。それでも出せない時は水の光の目のまま『Live2Dの姿を表示できませんでした。水の光の目で表示しています。』と『もう一度読み込む』を出す"
  empty: "該当なし。姿は常にどちらかが出る"
  offline: "姿の表示と切替は端末の中で完結する。伝える設定がオンで届かない時は『触れたことを伝えられませんでした。次に触れたときにもう一度送ります』、未接続なら『シャノンに接続すると、触れたことを伝えられます』、サーバーが受け取らない時は『サーバーが未対応のため、触れたことは伝わりません』"
  others_present: "『友人も一緒』の通話の間は、触れたことを『ほかの人もいる時のこと』として伝え、その旨を1行で示す"
  background: "アプリが前面にない間と、姿がどの画面にも出ていない間は描画を止める。姿がどの画面にも出ていない状態が90秒続くとLive2Dを解放し、次に必要な時に読み直す"
  low_power: "低電力モードでは描くコマ数を半分（毎秒30）にし、何も起きないまま1分たつと静止して『省電力のため、動きを止めています。触れると動きます』と示す。この呼び出しを持たない古いページでは、何もしていない姿が5秒で静止し、『省電力のため、動きを止めています。触れると動きます』と示す"
  shown_elsewhere: "同じ姿が優先度の高い別の画面に出ている時は、水の光の目で表示し『Live2Dの姿は、いま別の画面に出ています。ここでは水の光の目で表示しています。』と示す"
accessibility:
  dynamic_type: "アクセシビリティサイズでは、直前のひとことの行を出さず、姿の領域を残す。設定の文は複数行になる"
  voiceover: "姿は『シャノン、〈気持ち〉、〈状態〉』と読む1つの要素で、この上では指がそのまま届き（direct touch）、上下のスワイプで大きさを変えられる。表示の切り替えボタンは、ダブルタップで切り替え、長押しのメニューは設定 › すがた と同じ中身。姿・映し方・伝える設定・触れたときの返事は設定の標準のコントロールで、VoiceOverで操作できる。シャノンのひとことは読み上げで知らせる"
  target_size: "『位置を戻す』『もう一度読み込む』と各スイッチは48ポイント以上の高さ"
  focus: "設定の『トークで姿を見る』は、設定を閉じてトークの向き合う表示を出す"
  reduce_motion: "視差効果を減らす設定では、自分からのしぐさと体の揺れを止める（呼吸・まばたき・表情・口・触られた時の反応は続く）。この呼び出しを持たない古いページでは、何もしていない姿が5秒で静止し、『視差効果を減らす設定のため、動きを止めています。触れると動きます』と示す。姿の切替のフェードも行わない"
