schema_version: 1
screen_id: shannon-ios-body
platform: ios
baseline_commit: f0de77a
last_verified_at: 2026-10-03
verification_scope: "VERIFICATION_SCOPE_PLACEHOLDER"
user_job: "シャノンの姿そのものを見る。水の光の目とLive2Dの姿を切り替え、Live2Dの姿には指で触れ、いまの気持ちとしていることをひと目で知る"
primary_action: "すがたの切替（水の光の目／Live2Dの姿）"
preserve:
  - "既定は水の光の目。Live2Dの姿を選ばないかぎり、会話・音声会話の見た目はこれまでどおり"
  - "タスクの行、メッセージのアバター、考え中の表示、頭の中の『いま』の小さな目は、これまでの絵のまま"
  - "部屋を見る機能（アプリのカメラ）とは別。この画面はカメラを使わない"
improve:
  - "トークのツールバーの『からだ』から開く。Live2Dの姿を選んでいる時は、空の会話の小さな姿を押しても開く。設定の『すがた』の『からだを開く』からも開く"
  - "姿を大きく映す。Live2Dの姿は『映し方』で全身／上半身を選び、2本の指でつまんで大きさ、2本の指で動かして位置を変える。『位置を戻す』で元に戻る"
  - "1本の指はLive2Dの姿に届く（頭をなでる、つつく、くすぐる、手をつなぐ）。触れた時の動きは端末の中だけで起きる"
  - "姿の下に『いま：〈気持ち〉・〈していること〉』を1行で出す。していることは、返事を考えています／聞いています／話しています／考えごとをしています／読んでいます／メモを書いています／物語を書いています／物語を直しています／見せる準備をしています／物語の感想を待っています。何もしていない時は気持ちだけ"
  - "『体に起きたことをシャノンに伝える』（既定はオフ）。オフの間は何も送らない。オンにすると、触れた種類・長さ・強さ・時刻だけが届き、シャノンの気持ちが動き、ひとこと返すことがある"
  - "シャノンのひとことは姿の近くの吹き出しに数秒出し、VoiceOverに読み上げを知らせる。声では話さず、マイクも開かない"
  - "同じ姿が、対話モードの舞台・空の会話・Gemini音声会話にも出る。枠の大きさは2つの姿で同じ"
do_not_change:
  - "Live2Dのページ（apps/ios/Sources/ShannonAppCore/Live2D/embed/）の中身。更新はフォルダーごと差し替える（docs/live2d-embed.md）"
  - "サーバーへの登録は『触れられることだけを感じる体』（flags.touchOnly）。カメラの旗は送らず、presenceは読まない（docs/body-contract.md）"
states:
  loading: "Live2Dの姿を読み込む間は水の光の目を出し、『Live2Dの姿を読み込んでいます…』と小さく示す"
  error: "読み込めない時は一度だけ読み直す。それでも出せない時は水の光の目のまま『Live2Dの姿を表示できませんでした。水の光の目で表示しています。』と『もう一度読み込む』を出す"
  empty: "該当なし。姿は常にどちらかが出る"
  offline: "姿の表示と切替は端末の中で完結する。伝える設定がオンで届かない時は『触れたことを伝えられませんでした。次に触れたときにもう一度送ります』、未接続なら『シャノンに接続すると、触れたことを伝えられます』、サーバーが受け取らない時は『サーバーが未対応のため、触れたことは伝わりません』"
  others_present: "『友人も一緒』の通話の間は、触れたことを『ほかの人もいる時のこと』として伝え、その旨を1行で示す"
  background: "アプリが前面にない間と、姿がどの画面にも出ていない間は描画を止める。姿がどの画面にも出ていない状態が90秒続くとLive2Dを解放し、次に必要な時に読み直す"
  low_power: "低電力モードでは、何もしていない姿は5秒で静止し、『省電力のため、動きを止めています。触れると動きます』と示す"
accessibility:
  dynamic_type: "アクセシビリティサイズでは操作をスクロール領域に入れ、姿の領域を残す。文は複数行になる"
  voiceover: "姿は『シャノン、〈気持ち〉、〈状態〉』と読む1つの要素。すがたの切替・映し方・伝える設定は標準のコントロールで、VoiceOverで操作できる。シャノンのひとことは読み上げで知らせる"
  target_size: "『位置を戻す』『もう一度読み込む』と各スイッチは48ポイント以上の高さ"
  focus: "閉じると開いた場所（トーク、または設定）へ戻る"
  reduce_motion: "視差効果を減らす設定では、何もしていないLive2Dの姿は5秒で静止し、『視差効果を減らす設定のため、動きを止めています。触れると動きます』と示す。姿の切替のフェードも行わない"
