schema_version: 1
screen_id: shannon-ios-body
platform: ios
baseline_commit: 87093b2
last_verified_at: 2026-10-03
verification_scope: "2026-10-03: ページとの受け渡し（呼び出しの文字列、届いた知らせの読み取り、部位）、舞台の決まり（止める条件、読み込みの時間切れ、読み直しの回数、どの画面に出すか）、触れたことの送信（オフでは送らない、友人も一緒の扱い、送信中に届いた分、登録のやり直し）、声で返す時の受け渡しと最初の音声ターンへのreactionId、口の開きの計算をswift testで確認。iOS DebugとMac Debugのビルド。Simulator（iPhone 17、デザインプレビュー、機械の負荷が非常に高い状態）で、ページが読み込まれてreadyが届くこと、joyfulの顔を出す呼び出し、ページ内で顔を押してtouchとaskReactionが届くこと、全身・上半身・水の光の目、対話モードの舞台、音声会話の画面をLightとDarkで確認。実機、実際の指での触り心地、2本指の拡大と移動、声で返す（実サーバーの音声・マイク・通話への引き継ぎ）、口パクの実音声、空の会話の小さな姿、低電力モードと視差効果を減らす設定での見え方、裏から戻った後の描画、Dynamic Type、VoiceOver実読み上げ、Macでの表示は未確認"
user_job: "シャノンの姿そのものを見る。水の光の目とLive2Dの姿を切り替え、Live2Dの姿には指で触れ、いまの気持ちとしていることをひと目で知る"
primary_action: "すがたの切替（水の光の目／Live2Dの姿）"
preserve:
  - "既定は水の光の目。Live2Dの姿を選ばないかぎり、会話・音声会話の見た目はこれまでどおり"
  - "タスクの行、メッセージのアバター、考え中の表示、頭の中の『いま』の小さな目は、これまでの絵のまま"
  - "部屋を見る機能（アプリのカメラ）とは別。この画面はカメラを使わない"
improve:
  - "トークのツールバーの『からだ』から開く。Live2Dの姿を選んでいる時は、空の会話の小さな姿を押しても開く。設定の『すがた』の『からだを開く』からも開く"
  - "姿を大きく映す。Live2Dの姿は『映し方』で全身／上半身を選び、2本の指でつまんで大きさ、2本の指で動かして位置を変える。『位置を戻す』で元に戻る"
  - "1本の指はLive2Dの姿に届く（頭をなでる、つつく、くすぐる、手をつなぐ）。触れた時の動きは端末の中だけで起きる"
  - "姿の下に『いま：〈気持ち〉・〈していること〉』を1行で出す。していることは、返事を考えています／聞いています／話しています／考えごとをしています／読んでいます／メモを書いています／物語を書いています／物語を直しています／見せる準備をしています／物語の感想を待っています。何もしていない時は気持ちだけ"
  - "『体に起きたことをシャノンに伝える』（既定はオフ）。オフの間は何も送らない。オンにすると、触れた種類・長さ・強さ・時刻だけが届き、シャノンの気持ちが動き、ひとこと返すことがある"
  - "『触れたときの返事』で、文字で返す（既定）／声で返すを選ぶ。伝える設定がオンで、Live2Dの姿の時だけ選べる"
  - "文字で返す: シャノンのひとことは姿の近くの吹き出しに数秒出し、VoiceOverに読み上げを知らせる。声では話さず、マイクも開かない"
  - "声で返す: 吹き出しに加えて、シャノンが自分の声で言う（口が動く）。そのあとサーバーが決めた秒数だけマイクを開き、返事があれば音声会話の画面へ移ってそのまま会話になる。返事がなければ何も残さず閉じる。マイクの許可がない時は声だけで、マイクは開かない"
  - "トークと対話モードは文字で返す場なので、そこで触れた時のひとことは吹き出しだけ。音声会話の画面の姿には触れられない"
  - "同じ姿が、対話モードの舞台・空の会話・Gemini音声会話にも出る。枠の大きさは2つの姿で同じ"
do_not_change:
  - "Live2Dのページ（apps/ios/Sources/ShannonAppCore/Live2D/embed/）の中身。更新はフォルダーごと差し替える（docs/live2d-embed.md）"
  - "サーバーへの登録は『触れられることだけを感じる体』（flags.touchOnly）。カメラの旗は送らず、presenceは読まない（docs/body-contract.md）"
states:
  loading: "Live2Dの姿を読み込む間は水の光の目を出し、『Live2Dの姿を読み込んでいます… 40%』のように進み具合を小さく示す"
  error: "読み込めない時は一度だけ読み直す（一度も表示できないまま2回失敗したら、そこで止める）。それでも出せない時は水の光の目のまま『Live2Dの姿を表示できませんでした。水の光の目で表示しています。』と『もう一度読み込む』を出す"
  empty: "該当なし。姿は常にどちらかが出る"
  offline: "姿の表示と切替は端末の中で完結する。伝える設定がオンで届かない時は『触れたことを伝えられませんでした。次に触れたときにもう一度送ります』、未接続なら『シャノンに接続すると、触れたことを伝えられます』、サーバーが受け取らない時は『サーバーが未対応のため、触れたことは伝わりません』"
  others_present: "『友人も一緒』の通話の間は、触れたことを『ほかの人もいる時のこと』として伝え、その旨を1行で示す"
  background: "アプリが前面にない間と、姿がどの画面にも出ていない間は描画を止める。姿がどの画面にも出ていない状態が90秒続くとLive2Dを解放し、次に必要な時に読み直す"
  low_power: "低電力モードでは描くコマ数を半分（毎秒30）にする。この呼び出しを持たない古いページでは、何もしていない姿が5秒で静止し、『省電力のため、動きを止めています。触れると動きます』と示す"
  shown_elsewhere: "同じ姿が優先度の高い別の画面に出ている時は、水の光の目で表示し『Live2Dの姿は、いま別の画面に出ています。ここでは水の光の目で表示しています。』と示す"
accessibility:
  dynamic_type: "アクセシビリティサイズでは操作をスクロール領域に入れ、姿の領域を残す。文は複数行になる"
  voiceover: "姿は『シャノン、〈気持ち〉、〈状態〉』と読む1つの要素で、この上では指がそのまま届き（direct touch）、上下のスワイプで大きさを変えられる。すがたの切替・映し方・伝える設定は標準のコントロールで、VoiceOverで操作できる。シャノンのひとことは読み上げで知らせる"
  target_size: "『位置を戻す』『もう一度読み込む』と各スイッチは48ポイント以上の高さ"
  focus: "閉じると開いた場所（トーク、または設定）へ戻る"
  reduce_motion: "視差効果を減らす設定では、自分からのしぐさと体の揺れを止める（呼吸・まばたき・表情・口・触られた時の反応は続く）。この呼び出しを持たない古いページでは、何もしていない姿が5秒で静止し、『視差効果を減らす設定のため、動きを止めています。触れると動きます』と示す。姿の切替のフェードも行わない"
