schema_version: 1
screen_id: shannon-ios-yousu
platform: ios
baseline_commit: 68cfe7e
last_verified_at: 2026-10-03
verification_scope: "2026-10-03: 応答の読み取り（知らない値・欠けた欄）、出してよい操作の判定（allowed にあるものだけ、報告が古い・届かない・サーバーに届かない間は何も出さない、3分を過ぎたら読み直さなくても消える、送る直前の再確認）、確認の文（Windows アプリと一字一句同じ）、結果の文言、時系列の並びと文言、リンクの解釈を swift test で確認。iOS Debug と Mac Debug のビルドが通ることを確認。Simulator（架空のデータ、-ShannonDesignPreview -ShannonPreviewYousu tile／now／ops／opsStale／opsConfirm）では、運用（ライト）・シャノンのいま（ダーク）・Minebot の体の起動の確認（ダーク）の3画面を目で確認した。Mac の負荷が高く、スクリーンショットは保存できていない（未取得）。タイル、報告が古いときの表示、残りの外観は Simulator でも未確認。実機、実サーバーとの往復、実際の長押しでの送信、30秒おきの読み直しと裏に回した時の停止、Dynamic Type の最大サイズ、VoiceOver の実読み上げは未確認"
user_job: "サービスが動いているかとシャノンのいまのようすを確かめ、必要なときだけ、確認してから開始・停止・起動・今すぐ実行を頼む"
primary_action: "シートの「シャノン」の先頭のカードから「ようす」（シャノンのいま）を開く。運用は 設定 › 管理 › 運用 で見る（2026-10-03 の決まった構成、A4・A5）"
preserve:
  - "トーク一覧の検索とトークの並び（タイルは 作業・シャノン・設定 の 3 つ）"
  - "自律活動・書斎・作業の許可は、これまでの場所で決める（この画面は読むだけで、そこへ案内する）"
improve:
  - "運用の印（橙の三角）は、左上のボタンと 設定 のタイル、設定 › 管理 › 運用 の行に出す。理由を 1 行で添える。報告が一度も届いていない間は出さない。操作の失敗・期限切れは直近 1 時間だけ数える"
  - "運用の行は、報告が一度も届いていない間も消さず「運用の報告は、まだ届いていません。」と出す"
  - "操作のボタンは、サーバーが受け付けると返した対象にだけ出す。Discord の停止のように許されていない操作は出ない"
  - "操作は下からのシートで確認し、長押しで決める。確認の文は Windows アプリと同じ言い回しをそのまま出す"
  - "シャノンのいまは、待っていることを先頭に、気持ち・自分の時間・体・最近のできごとを1枚で静かに読む"
  - "ようす の上に いま／学び／気分 の切り替え（ADR-0008 §13 の案 A、2026-10-07）。気分 は気持ちのカードと、そのすぐ下の気分の推移（Mac の広い画面では横）。学び は所有者の端末だけ"
  - "学び：スキル（n／上限）の行は説明・「成功 7/8」か「試用中 2/3」・ライ氏の版・ピン。ピンはすぐに変わり、サーバーが受け付けなければ戻して一文を出す。行を押すと本文と版の記録。元にした会話が忘れられた・写しを取り下げたスキルは「（表示しないスキル）」と出し、本文もピンも出さない。やめたスキルは折りたたむ"
  - "学び：手応え（最近7日）は、選んだことごとに値と言葉（よい／まずまず／いまいち／まだ少ない）と回数。数字だけにしない"
  - "学び：価値表の版は、いまの版の時刻・でき方・結果の数。「前の版に戻す」と「更新を再開する」は確認してから送り、送り直さない"
do_not_change:
  - "確認の文（Minebot の体の起動の2文、予定の今すぐ実行の文）"
  - "気持ちの理由、見たもの、話しかけた言葉、触れたときの一言は出さない"
states:
  loading: "最初の読み込み中は進行表示だけを出す"
  empty: "報告が一度も届いていないときは、運用の行に「運用の報告は、まだ届いていません。」と出し、印は出さない。できごとが無いときは「まだありません」、待っていることが無いときは「あなたを待っていることは、ありません。」"
  stale: "報告が3分届かないと「報告が届いていません」と最後の報告の時刻を出し、状態は「動いていた」のように過去の言い方にして薄くし、ボタンをすべて消す"
  error: "サーバーに届かないときは「サーバーに届きません」と出し、最後に読めた報告をボタンなしで残す。操作が送れなかったときは理由を1文で出す"
  offline: "届いたか分からない操作は、やり直さず、操作の記録を確かめるよう伝える"
  conflict: "確認を開いている間に報告が古くなる・操作が受け付けられなくなると、長押しを無効にして理由を出し、送らない"
  waiting: "結果を待つ操作がある間は、その対象のボタンを消して「結果待ち…」と出し、3秒おきに読み直す"
  unavailable: "シャノンのいまの読み口が無いサーバー（404）・切られているサーバー・持ち主以外の端末（403）では、体と最近のできごとを出さず、気分は /v1/state のものを出す"
  learning_unavailable: "学びの読み口（/v1/autonomy/values、/v1/autonomy/skills）が 403・404 のときはその区画を出さず、両方ならタブも出さない。ほかの失敗は前の内容を残して「読めませんでした」"
  learning_change_failed: "ピンが受け付けられなければ元に戻して「固定できませんでした…」。戻す・再開が失敗したら送り直さず、読み直して「価値表を変えられませんでした。いまの状態を表示しています。」"
accessibility:
  dynamic_type: "行は、名前が1行に収まらないとボタンを下の段に回す。確認の文は折り返して全部読める。大きな文字ではタイルが行の一覧に替わる。シャノンのカードと運用の行の理由は折り返す"
  voiceover: "左上のボタンは「未確認N件、シャノンが待っていることN件、運用：〈理由〉」と読む。設定のタイルは「設定、運用：〈理由〉」。シャノンのカードは、いま・気分・待っていることを 1 つにまとめて読み、押すと ようす が開くと伝える。状態は名前と言葉で読む（色や形だけに頼らない）。ボタンは「Discord を開始」のように対象ごと読む。長押しはタップでも確認の対話から決められる。時系列は日・時刻・できごと・届き方を1つにまとめて読む"
  target_size: "行のボタンと閉じるボタンは44ポイント以上"
  focus: "確認を閉じると運用の一覧へ戻る"
  learning_voiceover: "スキルの見出しは「スキル、上限20のうち6」。行は説明・成功・ライ氏の版・固定中を1つに読み、ヒントは「本文と版の記録を開きます」。ピンは別の要素で「固定する／固定を外す」と値「固定中／固定していません」。手応えは「物語を見せる、手応えはよい、プラス0.53、8回」"
  reduce_motion: "長押しの進み具合は、動きを減らす設定では文字と割合で示す"
evidence:
