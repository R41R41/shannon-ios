schema_version: 1
screen_id: shannon-ios-yousu
platform: ios
baseline_commit: 68cfe7e
last_verified_at: 2026-10-03
verification_scope: "2026-10-03: 応答の読み取り（知らない値・欠けた欄）、出してよい操作の判定（allowed にあるものだけ、報告が古い・届かない・サーバーに届かない間は何も出さない、3分を過ぎたら読み直さなくても消える、送る直前の再確認）、確認の文（Windows アプリと一字一句同じ）、結果の文言、時系列の並びと文言、リンクの解釈を swift test で確認。iOS Debug と Mac Debug のビルド、Simulator（架空のデータ、-ShannonDesignPreview -ShannonPreviewYousu tile／now／ops／opsStale／opsConfirm）でライトとダークの表示を確認。実機、実サーバーとの往復、実際の長押しでの送信、30秒おきの読み直しと裏に回した時の停止、Dynamic Type の最大サイズ、VoiceOver の実読み上げは未確認"
user_job: "サービスが動いているかとシャノンのいまのようすを確かめ、必要なときだけ、確認してから開始・停止・起動・今すぐ実行を頼む"
primary_action: "トーク一覧の「ようす」を開き、上の切り替えで「シャノンのいま」と「運用」を見る"
preserve:
  - "トーク一覧の 作業・頭の中・設定 と検索、トークの並び"
  - "自律活動・書斎・作業の許可は、これまでの場所で決める（この画面は読むだけで、そこへ案内する）"
improve:
  - "タイルを4つにして「ようす」を足す。不調・不明のサービスがあるか、報告が届かなくなったときだけ、タイルに小さな印を付ける"
  - "「運用」は、旧ランタイムの報告が一度でも届いたサーバーでだけ切り替えに出す"
  - "操作のボタンは、サーバーが受け付けると返した対象にだけ出す。Discord の停止のように許されていない操作は出ない"
  - "操作は下からのシートで確認し、長押しで決める。確認の文は Windows アプリと同じ言い回しをそのまま出す"
  - "シャノンのいまは、待っていることを先頭に、気持ち・自分の時間・体・最近のできごとを1枚で静かに読む"
do_not_change:
  - "確認の文（Minebot の体の起動の2文、予定の今すぐ実行の文）"
  - "気持ちの理由、見たもの、話しかけた言葉、触れたときの一言は出さない"
states:
  loading: "最初の読み込み中は進行表示だけを出す"
  empty: "報告が一度も届いていないときは「運用」を出さない。できごとが無いときは「まだありません」、待っていることが無いときは「待っていることはありません」"
  stale: "報告が3分届かないと「報告が届いていません」と最後の報告の時刻を出し、状態は「動いていた」のように過去の言い方にして薄くし、ボタンをすべて消す"
  error: "サーバーに届かないときは「サーバーに届きません」と出し、最後に読めた報告をボタンなしで残す。操作が送れなかったときは理由を1文で出す"
  offline: "届いたか分からない操作は、やり直さず、操作の記録を確かめるよう伝える"
  conflict: "確認を開いている間に報告が古くなる・操作が受け付けられなくなると、長押しを無効にして理由を出し、送らない"
  waiting: "結果を待つ操作がある間は、その対象のボタンを消して「結果待ち…」と出し、3秒おきに読み直す"
  unavailable: "シャノンのいまの読み口が無いサーバー（404）・切られているサーバー・持ち主以外の端末（403）では、体と最近のできごとを出さず、気分は /v1/state のものを出す"
accessibility:
  dynamic_type: "行は、名前が1行に収まらないとボタンを下の段に回す。確認の文は折り返して全部読める。大きな文字ではタイルが行の一覧に替わる"
  voiceover: "状態は名前と言葉で読む（色や形だけに頼らない）。ボタンは「Discord を開始」のように対象ごと読む。長押しはタップでも確認の対話から決められる。時系列は日・時刻・できごと・届き方を1つにまとめて読む"
  target_size: "行のボタンと閉じるボタンは44ポイント以上"
  focus: "確認を閉じると運用の一覧へ戻る"
  reduce_motion: "長押しの進み具合は、動きを減らす設定では文字と割合で示す"
