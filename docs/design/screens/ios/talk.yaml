  approved: []
  privacy: "カメラを連続・自動・バックグラウンドで取得しない。ユーザーが撮影またはライブラリで選び、プレビューで承認した1枚だけを縮小・再エンコードして共有する。写真本体は会話履歴へ保存せず、表示履歴には写真共有の印だけを残す。「友人も一緒」は本人の履歴・記憶・タスク・ノートをモデルへ渡さず、音声コマンド・目標・約束・記憶の抽出を行わない。その間の会話は端末のメモリ上だけに持ち、応答のためにその通話の直近の会話だけをサーバーへ送る。サーバーはそれを会話履歴・経験・個人記憶へ保存しない。通話終了後に本人が「要約を残す」を選んだ時だけ、相手の名前（名乗った場合）・話題・シャノンが次に話したいと言ったことの短い要約を通話のトークへ残す。発言そのものは残さず、要約は個人記憶・プロフィールの材料にしない。断る・放置する・アプリを終了する・通話が失敗した場合は何も残らない。声で「本人だけ」へ戻すことはできない。Geminiの永久APIキーはAzureの0600秘密ファイルだけに置き、端末へはgemini-3.5-transcribe-liveとTEXT出力に固定した1回限りの短寿命トークンだけを渡す。録音PCMと生成音声は履歴へ保存しない。明示的に開始した通話は小型化、アプリ内画面移動、他アプリ表示中もマイクと再生を継続し、通話中表示と終了操作を提供する。明示的な終了で録音と再生を停止し、電話などの音声割り込みはiOSの許可に従って再開する"
