  voiceover: "入力、添付、Web検索、音声会話開始、送信、生成物保存、参加者モード、入力マイク、使用中の入力名、写真撮影、ライブラリ選択、選び直し、写真共有、チャットアイコン選択の役割を個別に読み上げる"
  target_size: "主要操作のヒット領域を44ポイント以上にする"
  focus: "入力中にTextFieldを破棄せず、会話外の明示操作ではキーボードを閉じて最初のタップをその操作へ渡す"
  reduce_motion: "入力欄、Waterlight Eye、音声グローはReduce Motion時に空間移動・軌道・反復運動を行わず、状態固有の目の形と静止光を保つ"
