accessibility:
  dynamic_type: "複数行入力、添付名、生成物名は必要に応じて伸長または安全に省略する。アクセシビリティ文字サイズでは対話の補助ラベルと作業通知の副文を省き、回答・Waterlight Eye・入力操作を優先する"
  voiceover: "返信内コードは『〈言語〉のコード、N行』として含まれるコピー・展開操作へ個別に到達できる。返信待ちは『シャノンが考えています』と経過秒を値で伝える。話題候補は入力欄に入れるだけで送信しないことをヒントで伝える。入力、添付、Web検索、音声会話開始、送信、生成物保存、参加者モード、入力マイク、使用中の入力名、写真撮影、ライブラリ選択、選び直し、写真共有、チャットアイコン選択の役割を個別に読み上げる"
  target_size: "主要操作のヒット領域を44ポイント以上にする"
  focus: "入力中にTextFieldを破棄せず、会話外の明示操作ではキーボードを閉じて最初のタップをその操作へ渡す"
  reduce_motion: "入力欄とWaterlight EyeはReduce Motion時に空間移動・軌道・反復運動を行わず、状態固有の目の形を保つ。小さな音量表示も静止させる。返信待ちの行バーの光は止め、文言と経過秒で待機中を伝える。コードの展開、話題候補の出現、説明シートの項目表示は移動なしの短い切替にする"
