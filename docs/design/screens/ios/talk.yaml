  approved: []
  privacy: "カメラを連続・自動・バックグラウンドで取得しない。ユーザーが撮影またはライブラリで選び、プレビューで承認した1枚だけを縮小・再エンコードして共有する。写真本体は会話履歴へ保存せず、表示履歴には写真共有の印だけを残す。ゲストモードは所有者の履歴・記憶・タスクをモデルへ渡さず、字幕を会話履歴や個人記憶へ保存しない。Geminiの永久APIキーはAzureの0600秘密ファイルだけに置き、端末へはgemini-3.5-transcribe-liveとTEXT出力に固定した1回限りの短寿命トークンだけを渡す。録音PCMと生成音声は履歴へ保存しない。明示的に開始した通話は小型化、アプリ内画面移動、他アプリ表示中もマイクと再生を継続し、通話中表示と終了操作を提供する。明示的な終了で録音と再生を停止し、電話などの音声割り込みはiOSの許可に従って再開する"
