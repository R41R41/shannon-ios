verification_scope: "2026-10-07 第4段階: iPhone17/iOS26.5専用Simulatorの隔離合成fixtureで起動、会話の作業入口と既存通知の非重複、一覧シート、個別停止と再開、件数と状態の更新をCUAで確認（Light）。Dark・すがた側入口・全停止・大きい文字・VoiceOver実読み上げ・実サーバー・実機は未確認。 2026-10-02（書斎へのカード）: シャノンが作品を見せるメッセージに付くカードのDTO解読とキャッシュの往復をswift test、Debugビルドで確認。実機でカードを押して書斎が開くこと、VoiceOver実読み上げは未確認。 2026-10-02（人と同席者ごとの記憶）: 名前の確定規則、覚える・残さない、同席者ごとの開示、終了カードの文言と状態、案内文は決定的な自動テスト（サーバー・swift test）と未署名ビルドで確認。実際の二人の声での名前の聞き取り、再会時の挨拶の聞こえ方、終了カードの実表示と実タップ、VoiceOver実読み上げ、大きい文字での折り返しは未確認。 2026-10-02（表情は気持ちから・通話のEye）: 表情の決め方、通話計画の表情、保存される表情、VoiceOver文言は決定的な自動テストと未署名ビルドで確認。実機の通話で声とEyeが揃って見えるか、モデルの返答で表情がどう分布するか、VoiceOverの実読み上げは未確認。2026-10-02（友人も一緒）: 切替・通話内文脈・呼びかけ判定・要約の保存と破棄は決定的な自動テストと未署名ビルドで確認。実際の二人の声、騒がしい店内、切替時の挨拶の聞こえ方、要約の文面、VoiceOver実読み上げ、実機での自動ロック停止は未確認。2026-10-01: iOS 26.5 Simulator（iPhone 17 Pro）の合成DEBUG fixtureで場所カードのMapKit描画とリンク表示をLight/Darkで確認。地図シートの実タップ、VoiceOver実読み上げ、実機位置取得、実API検索は未確認。2026-09-30〜10-01（Swift Pieces取り込み）: iOS 27.0 Simulator（iPhone 17 Pro）の合成DEBUG fixtureで、返信コード（Dark、Light）、返信待ち（Light、Reduce Motionで光が静止）、空の会話の話題候補（Light、Accessibility Extra LargeのDark）、マイク説明シート（Light、Accessibility Extra Large）、拒否済み（Dark）、カメラ説明シート（Light）を表示確認。大きい文字の返信コードと返信待ちはスクロール位置の都合で画面外となり未確認。コピー・展開・チップ選択・説明シートの続けるの実タップ、VoiceOver実読み上げ、実機のシステム許可ダイアログは未確認。以前の記録: 既存iOS 26.5 Simulatorの非個人DEBUG fixtureでラベル付き操作、Lightの待受、Darkの複数行入力・キーボードと接続失敗、ゲスト再接続のAccessibility Extra Large Textを確認。Build 92の音声のみ失敗・生成途中失敗の通知は入力欄と重ならない。2026-09-29追加の通話小型化・画面移動・実装案確認の実表示と実タップは、Mac UI操作のタイムアウトにより未検証。以前の画像を新規UIの証拠としない。マイク・写真・人物の実タップ、Reduce Motion実表示、実機音声Smokeも未確認 2026-10-01（作業通知の見直し）: 作業通知の内容（状態語：作業名、許可対象または次の一手の副行）、その場の「許可」を出す条件、確認済みの扱い、送信失敗の文言はSwift単体テストとiOS／Macビルドで確認。iOS 27.0 Simulator（iPhone 17e、Light）の合成コマンド承認で、通知が『許可待ち：作業名』と対象コマンドの全文、「許可」を表示することを目視（shannon-ios-task-notice-approve-light-v2.png）。実タップ・Dark・VoiceOver・大きい文字・続きが必要の通知の実表示は未確認。2026-10-01: iOS 26.5 Simulator（iPhone 17 Pro）の合成DEBUG fixtureで場所カードのMapKit描画とリンク表示をLight/Darkで確認。地図シートの実タップ、VoiceOver実読み上げ、実機位置取得、実API検索は未確認。2026-09-30〜10-01（Swift Pieces取り込み）