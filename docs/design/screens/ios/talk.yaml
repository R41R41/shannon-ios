user_job: "シャノンとの会話を読み、必要な資料やWeb調査を添えて同じトークを続ける"
primary_action: "入力欄からメッセージを送信する"
preserve:
  - "会話履歴、選択中トーク、Gemini音声会話、音声入力"
  - "スクロール表示と対話表示"
  - "添付とWeb検索は送信ごとに明示して使用する"
improve:
  - "シャノンの名前の横の語は、その返答でのシャノン自身の気持ち。持ち主の発言に含まれる単語では決めない（「考えてみて」で考え中、「悲しい」でかなしい、にならない）。得意げ・慌てている・申し訳なさそうは専用の絵がないため、近い表情の絵を使い、語だけを気持ちの名前にする"
  - "音声通話中のWaterlight Eyeは、声が演じているその回の感情を映す。最初の一文で暫定の表情になり、返答が確定すると同じ回の確定した表情になる。「友人も一緒」でも同じように変わり、表情は通話中の端末内だけで保持して保存しない"
  - "最初の返答より前の表情は、サーバーが示す今の気分、無ければ穏やか。興味津々を既定にしない"
  - "シャノンの返答の下に、その回で取り込んだことを静かな1行で示す（約束にしました／覚えました・覚え直しました・覚えています／目的にしました）。取り込みは返答の後に届くので、返答は待たせず、届いた時点で同じ返答の下に出る。再起動後や別の端末でも履歴と一緒に出る。何も取り込まなかった回には何も出さない"
  - "取り込みの行を押すと頭の中の同じ項目（記憶の詳細、または目的の管理）がシートで開く。行の「取り消す」は既存の記憶操作（約束の取り消し・記憶を忘れる・目的の取り下げ）を使い、記憶を忘れる時だけ影響（その内容と、その内容に触れた返答や要約だけが材料から外れ、復元すると元に戻ること）を説明して確認する"
  - "時刻ちょうどの知らせを頼まれた時は、約束の行に『時刻ちょうどにはお知らせできません。1日1回の声かけの枠でお知らせします』を添える。『30分後に教えて』やタイマーは約束にせず、できないことを1行で伝える"
  - "約束のリマインドの下に『完了にする／あとで』を出す。完了・あとで・取り消し済みの後は操作の代わりに結果を1行で示す。『あとで』は1日1回の枠の中でもう一度だけ声をかける"
  - "入力中も本文の左余白を保ち、文字が容器端へ寄らない"
  - "用途の曖昧な黄色い追加ボタンを使わず、クリップで添付機能を示す"
  - "トーク名、トーク一覧、新規トーク、表示切替はNavigationStackの標準タイトル・ツールバー・シートで提供する"
  - "トーク一覧、作業全体、頭の中、設定は標準Listと検索を使う一枚のシートから移動できる"
  - "トーク一覧シートは上部の検索欄、作業（未読件数バッジ）・頭の中・設定の3タイル、今日・昨日・今週・それ以前の日付グループの順に並べる。行はタイトル（選択中は太字とチェックで色以外でも示す）、右端の時刻（今日は時刻、昨日、今週は曜日、それ以前は月/日）、端末キャッシュにある最新メッセージの1〜2行プレビュー（無ければ件数）を示す。タイトル編集とアーカイブはスワイプ操作と長押しメニューで提供する。アクセシビリティ文字サイズではタイルを縦の行に切り替える。新しいAPIは使わない"
  - "入力欄と状態表示はsafeAreaInset内の標準bar背景に置き、本文とホームインジケータへ重ならない"
  - "非表示の作業・記憶画面が検索欄やツールバーをトーク画面へ漏らさない"
  - "入力中でもトーク一覧、新規トーク、設定、外観の直接操作を最初のタップで実行できる"
  - "生成物を会話内で確認し、ユーザーが選んだ場所へ保存できる"
  - "空状態のShannonだけはWaterlight Eyeの視線・瞬き・表情変化で静かに存在を示す"
  - "空状態の大型Waterlight Eyeは角丸四角と160%の目で表示し、タップ時だけ驚きから照れへ反応する"
  - "対話表示とLive音声のWaterlight Eyeは22感情と会話状態を目の形・球面視線・連続モーフで示し、接続中・聞いています・考えています・話していますの文言を置き換えない"
  - "Waterlight Eyeはポインターのない端末でも不規則な瞬きと微細な自律視線を保ち、押している間だけ指の位置を見る"
  - "Gemini音声では会話中の調査結果を同じ画面へ戻し、状態を接続中・聞いています・考えています・話していますで明示する"
  - "Gemini音声中のカメラはユーザーが撮影した1枚だけをプレビューし、共有確認後に会話へ戻す"
  - "テキスト対話では写真ライブラリの1枚を送信前に確認し、画像認識結果を同じ会話の返答へ渡す"
  - "Gemini音声中は撮影または写真ライブラリの1枚を選び、確認後に画像認識結果を同じ音声会話へ戻す"
  - "チャット中のシャノンの小さなアバターは表情アイコンと2つ目のアプリアイコン（L06）を端末設定で切り替えられる"
  - "Gemini音声は小さい画面や大きい文字でも状態と映像をスクロールできる"
  - "音声は「本人だけ」で開始し、友人が加わる時だけ「友人も一緒」へ切り替えられる。切り替えは通話をつなぎ直さず、通話時間・字幕・音声・ミュートを保つ。操作ボタンのほか、本人が「友達を紹介するね」「友達と一緒にいる」と言うことでも切り替わり、判断がつかない言い方ではシャノンが「お友達も一緒ですか？」と尋ねる。声で「本人だけ」へ戻ることはできない"
  - "「友人も一緒」は話者を識別せず、本人の過去会話・個人記憶・タスク・ノートを応答へ投影しない。この通話の中の会話だけを通話中に覚え、切り替え前の会話は本人のトークに残る"
  - "「友人も一緒」ではシャノンは紹介の場として挨拶し、呼ばれた時・問われた時・自分の発言への短い反応にだけ返事をして、同席者同士の会話には黙る"
  - "「友人も一緒」の時間があった通話の終了後、通話ピルの位置で「この通話の要約をトークに残しますか？」と尋ねる。「要約を残す」を選んだ時だけ短い要約を通話のトークへ残し、「残さない」・放置・次の通話開始・アプリ終了では何も残さない"
  - "残した要約はトーク内で「通話の要約」ラベル付きのシャノンのメッセージとして表示し、本人の発言として扱わない"
  - "通話中は画面の自動ロックを止める"
  - "Gemini音声中も認識接続を閉じずにテキストを送信でき、返答は音声と字幕で続ける"
  - "Gemini音声中は自動、iPhone内蔵、接続中の外部マイクを選べ、実際に使用中の入力名を表示する"
  - "波形ボタンは選択画面を挟まず、Gemini音声会話を直接開始する"
  - "Gemini音声画面はマイク・写真・会話の相手（ラベルは現在の状態「本人だけ」または「友人も一緒」）のラベル付き操作を常時表示し、大きい文字では縦に並べる"
  - "Gemini音声の入力はsafeAreaInset内の複数行TextFieldで行い、キーボード表示中も送信操作を保つ"
  - "音声画面下部は小さな実入力レベル表示を使い、巨大な光や進捗に見える横棒・左右走査を使わない"
  - "音声画面の背景は、iOS 18以降かつReduce Motionでない場合だけ、空色・水色・深い青の薄い色面がゆっくり漂う。話している間だけわずかに大きく動き、接続失敗と終了時は止まる。iOS 17とReduce Motionでは静止グラデーションのままにする"
  - "Gemini音声は連続認識、通常のShannon返答、カスタム音声による文単位TTS、字幕、段階的な割り込み、応答時間、費用見積りを同じ画面で確認できる"
  - "ユーザーが話し始めたら再生を弱め、発話確定後に生成と再生を破棄する。未回答の入力は保持し、次の発話と時系列で合わせて回答する。誤検知では音量を戻す"
  - "対話表示はShannon返答をMarkdownとして読みやすい行幅で表示し、長い会話は44ポイント以上の『会話全体を読む』操作から履歴へ戻れる"
  - "Gemini音声中のテキスト送信は接続失敗や再接続をまたいでも元の入力文を保持し、同じ文を選択・再試行できる"
  - "場所探しの返答は候補名・住所・Apple Mapsリンクに加え、同じ会話内で操作できるMapKitカードを示す。音声はリンクを読み上げず、履歴に残す"
  - "『近く』の場所探しだけ端末の既存位置許可を使って今回の位置を取得し、失敗時は現在地を推測せず地域を尋ねる"
  - "音声画面の『小さく』と『終了』を区別し、他のトーク・作業・頭の中・設定を開いても通話を継続する"
  - "小さくした通話はナビゲーションの上の小さなピル（状態・通話時間・赤い終了ボタン）で示す。ピルをタップするとその場で広がり、相手（本人だけ／友人も一緒）と継続の説明、詳細を開く・ミュート・作業への移動を出す。終了ボタンは常に見えるが、確認してから終了する。大きい文字では常に広げた形で表示する。「友人も一緒」の間は、広げなくてもピルに「友人も一緒」を表示する"
  - "本人音声の実装案から内容・実行環境の確認と明示的な開始へ進める。提案と実行中を混同せず、ゲストには表示しない"
  - "返信内のコードは言語ラベル、コピー（押すと「コピー済み」）、テキスト選択、横スクロールを持つ。15行以上は最初の12行で折りたたみ「残りN行を表示」で展開し、展開後は「折りたたむ」で戻せる"
  - "コードの構文色は字句ベースでSwift・JS/TS・Python・Shell・JSON・YAML・SQL等に限り、未知の言語は色なしで表示する。色はShannonの意味色から解決し、面は外観に従う読書面を使う"
  - "テキスト返信待ちは54ptの表情アバター、「考えている…」（記憶検索中は「記憶を探しています…」）、返信と同じ形の3本の行バー、1秒以降の経過秒で示す。行バーの光はintelligenceSkyで流れ、Reduce Motionでは止める"
  - "空のスクロール表示の会話では、Waterlight Eyeと「おかえり／今日はどこから始める？」を本文域の中央に置き、入力欄の上に縦並びの話題候補を最大3件出す。候補は2行まで折り返し、画面端で途切れない。選ぶと入力欄に文が入るだけで送信しない。候補は読み込み済みの今日の関心・進行中の作業・興味から作り、無ければ固定の3件にする。新しいAPIやモデル呼び出しはしない"
  - "許可待ち・続きが必要・完了・失敗の作業の通知は入力欄の上ではなくナビゲーション直下に示す。1行目は必ず『状態語：作業名』。許可待ちは2行目に許可する対象（コマンド・パス・接続先）を等幅で、対象が無ければ許可の種類を出す。続きが必要は2行目に『次：〈次の一手〉』を出す。入力欄の上には状態通知・音声入力・話題候補・入力欄だけを置く"
  - "会話内の作業は状態で形を変える。開始するかを決める提案だけが説明と「今はやめる／設定して始める」を持つカードになり、ボタンは右寄せの通常サイズとする。準備中・作業中・許可待ち・続きが必要・一時停止中は1行の要約（作業名・『作業中 6/8』や『許可待ち』・開く）、完了・失敗・中止は枠のない静かな1行にする。許可待ちと続きが必要は注意色にする。状態は色だけでなく文言とシンボルでも示す。状態語は docs/design/screens/ios/work.yaml の vocabulary に従う"
  - "同じトークで2件目以降の作業提案も必ずカードになる。開始済みの作業と識別子が重なった提案は捨てずに別の提案として表示し、開始済みの作業を提案へ戻さない"
  - "送信に失敗した時は原因別の文言を出す（オフライン、時間切れ、サーバーに接続できない、8,000文字超、添付が大きすぎる、混雑、端末の接続が無効、シャノン側の失敗）。持ち主にできる次の操作を必ず添え、「ローカルAPI」など持ち主が操作できないものを案内しない"
  - "Gemini音声のマイク許可が未決定の時だけ、システム確認の直前に説明シートを出す（割り込める・録音データを保存しない・終了でいつでも止まる）。システム確認は説明シートの「続ける」をタップした時に出る"
  - "マイクまたはカメラが拒否済みの時は、同じ説明シートが設定アプリへの案内に切り替わる。音声中の写真撮影もカメラ未決定時は同じ部品で説明してから確認する"
do_not_change:
  - "会話、作業、記憶の正本と同期規則"
  - "ユーザー確認前に外部アプリへ書き込まない境界"
  - "人物管理画面や声による人物確認を追加しない"
states:
  turn_capture: "取り込みは返答より後に届く。届くまでは何も出さず、進行表示もしない。忘れた・取り消した・取り下げた項目の行は消える。操作に失敗したら行の下に理由を出し、成功扱いにしない。ゲストの音声では出さない"
  loading: "履歴取得中も入力内容を破棄しない"
  empty: "入力欄、音声、添付の開始点を静かに示す"
  error: "既存履歴と選択済み添付を保ち、安全なエラーを示す"
  offline: "表示キャッシュを保ち、未送信と再接続待ちを区別する"
  conflict: "サーバー状態を再読込し、ユーザー入力を黙って失わない"
  selection: "選択中トーク、添付、Web検索状態を色以外でも示す"
  gemini_connecting: "短寿命の認識トークン取得とWebSocket設定が完了するまで接続中を示し、音声開始を誤表示しない"
  gemini_listening: "連続入力中の音量と参加者の字幕を示し、短い無音後に通常のShannon返答へ進む"
  gemini_processing: "調査、通常のShannon返答、文単位の音声生成を考えていますとして示す"
  gemini_speaking: "Shannonの返答字幕、認識モデル、カスタム声、費用見積りを示し、割り込みを受け付ける"
  gemini_error: "認識・返答生成・途中で止まった生成・音声のみの失敗を区別する。全文完成後の音声失敗は返答を画面と履歴に残し、同じ入力の再生成を要求しない。全文未完成なら入力を保持し、追加発話や再送へ戻れる"
  camera_preview: "撮影画像、撮り直す、共有を同時に示し、自動送信しない"
  library_preview: "写真ライブラリから選んだ画像をプレビューし、選び直す・外す・共有するを明示する"
  library_error: "読み込み・画像認識・送信に失敗しても音声セッションを維持し、テキスト対話では再試行可能な写真を保持する"
  camera_error: "画像と音声セッションを保ったまま、安全な再試行メッセージを示す"
  voice_guest: "「友人も一緒」の間、目の上に「友人も一緒」と、覚える範囲（この通話の中だけ）・保存しないこと（終了時に本人が選んだ時だけ短い要約）・声が文字起こしのため外部へ送られ録音を残さないことを常時表示する。切替の確認は通話が続くことを説明する。字幕は「話し手」と表示する。写真の操作は薄く残し、押すと使えない理由を示す"
  voice_call_summary: "尋ねる・保存中・保存済み・失敗（もう一度試す／残さない）の4状態。モーダルにせず通話ピルの位置に出し、VoiceOverには出現時に質問を読み上げる"
  voice_text: "送信中、送信失敗、再試行を音声接続と分離し、失敗時も入力文を失わない"
  place_search: "候補の検索中は地図を準備中と示す。MapKitで位置を確認できない候補はピンを出さず、Apple Mapsリンクから確認できる。候補ゼロでは空の地図を出さない"
  dialogue_history: "返答を読み終えた位置から、明示操作で会話履歴全体へ戻れる"
  voice_input_route: "選択希望と実際の入力経路を区別して示し、切断された外部マイクは選択不可にする。保存した選択のマイクが未接続なら通話を失敗させず自動の経路で始め、『使用中: 〈実際のマイク〉（〈選択〉が未接続）』と示す。選択は保持し、再接続時に戻す"
  voice_input_level: "実マイク入力に小さな5本のバーで反応し、処理・発話時は静止する。状態文言とWaterlight Eyeを置き換えない"
  voice_minimized: "開始トークに紐づいた通話を継続し、閲覧中の別トークへ履歴や写真を混入させない。未送信文と写真プレビューは再展開しても保持する"
  voice_background: "明示的に開始した通話は他アプリ表示中もマイクと再生を継続する。戻ると同じ通話バーから詳細と終了へ進める。電話等の音声割り込みを尊重し、再開できないときは再接続を示す"
  reply_code: "言語名またはコード、コピー操作、必要時の展開操作を示す。コピー済みは約1.6秒で元に戻り、文言とシンボルでも伝える"
  text_waiting: "返信待ちの表情アバター、考えている…、行バー、経過秒を示す。経過秒は最初の1秒は出さない"
  empty_suggestions: "空の会話かつ入力が空の間だけ話題候補を示し、入力を始めたら隠す"
  task_notice: "通知は1件だけ出す。優先は許可待ち、続きが必要、結果（完了・失敗・中止）の順で、同じ区分では新しいもの。タップで作業画面を開く。確認済みは作業単位ではなく『見たもの』単位で持つ：完了・失敗・中止と、続きが必要の各停止は、作業画面で見たら消える。同じ作業が新しい許可待ち・新しい停止・終了に入れば、以前に開いた作業でも再び出る。許可待ちは作業画面を開いても消えず、許可する・しないを決めるまで残る。実ホストの許可タイトルは種類ごとの固定文（『コマンド実行の許可』『ファイル変更の許可』）なので、通知は許可する対象そのものを見せる。その場の「許可」（今回だけ）は、コマンド実行・ファイル変更の1回限りの許可で、対象が通知内に全文表示できる時（80文字以内・1行・ホスト側で省略されていない）だけ出す。対象が無い・長い・省略されている時と、大きい文字で副行を省く時は「許可」を出さず、通知は作業画面を開く。通信・権限・この作業中の許可は長押しの流れを保つため作業画面でのみ行う。送信に失敗したら通知にその旨を出し、同じ許可を二重に送らない。自分でこの端末から中止した作業は通知しない"
  send_failure: "失敗した発言は残し、原因別の文言と「再送」を出す。8,000文字超は再送しても通らないため、分けて送るよう案内する"
  permission_primer: "説明・確認中・拒否済みの3状態。確認中は操作を無効にし、拒否済みは設定を開くと閉じるを示す。説明中の「今はしない」は待機中の通話を終える"
  voice_implementation_review: "音声の実装案から既存の確認・設定・開始画面へ進む。画面を開いただけではAgent Hostに送らない"
accessibility:
  dynamic_type: "複数行入力、添付名、生成物名は必要に応じて伸長または安全に省略する。アクセシビリティ文字サイズでは対話の補助ラベルと作業通知の副行を省き、回答・Waterlight Eye・入力操作を優先する。副行を省く時は許可対象を読めないので、その場の「許可」も出さず作業画面で判断するアクセシビリティ文字サイズでは対話の補助ラベルと作業通知の副文を省き、回答・Waterlight Eye・入力操作を優先する"
  voiceover: "シャノンの返答は『シャノン、〈気持ち〉。〈本文〉』の順で読み、表情名の後ろに「表情」を付けない。Waterlight Eyeは『シャノン、〈気持ち〉、〈状態〉』を読む。作業通知は『シャノンの作業、〈作業名〉、〈状態語〉、〈許可対象または次の一手〉』を読み、その場の「許可」は『今回だけ許可、〈対象〉』と作業名入りのヒントを読む。返信内コードは『〈言語〉のコード、N行』として含まれるコピー・展開操作へ個別に到達できる。場所カードは候補名・住所、地図を開く操作を個別に読み上げる。返信待ちは『シャノンが考えています』と経過秒を値で伝える。話題候補は入力欄に入れるだけで送信しないことをヒントで伝える。入力、添付、Web検索、音声会話開始、送信、生成物保存、参加者モード、入力マイク、使用中の入力名、写真撮影、ライブラリ選択、選び直し、写真共有、チャットアイコン選択の役割を個別に読み上げる 取り込みの行は『約束にしました：明日 プレゼンの練習』のように内容ごと読み上げ、押すと頭の中で開くことをヒントで伝える。取り消し・完了にする・あとでは個別の操作として読み上げる。返信内コードは『〈言語〉のコード、N行』として含まれるコピー・展開操作へ個別に到達できる。場所カードは候補名・住所、地図を開く操作を個別に読み上げる。返信待ちは『シャノンが考えています』と経過秒を値で伝える。話題候補は入力欄に入れるだけで送信しないことをヒントで伝える。入力、添付、Web検索、音声会話開始、送信、生成物保存、参加者モード、入力マイク、使用中の入力名、写真撮影、ライブラリ選択、選び直し、写真共有、チャットアイコン選択の役割を個別に読み上げる"
  target_size: "主要操作のヒット領域を44ポイント以上にする。取り込みの行、取り消し、完了にする、あとでも44ポイント以上にする"
  focus: "入力中にTextFieldを破棄せず、会話外の明示操作ではキーボードを閉じて最初のタップをその操作へ渡す"
  reduce_motion: "入力欄とWaterlight EyeはReduce Motion時に空間移動・軌道・反復運動を行わず、状態固有の目の形を保つ。小さな音量表示も静止させる。返信待ちの行バーの光は止め、文言と経過秒で待機中を伝える。コードの展開、話題候補の出現、説明シートの項目表示は移動なしの短い切替にする"
