  privacy: "カメラを連続・自動・バックグラウンドで取得しない。ユーザーが撮影またはライブラリで選び、プレビューで承認した1枚だけを縮小・再エンコードして共有する。写真本体は会話履歴へ保存せず、表示履歴には写真共有の印だけを残す。ゲストモードは所有者の履歴・記憶・タスクをモデルへ渡さず、字幕を会話履歴や個人記憶へ保存しない。Geminiの永久APIキーはAzureの0600秘密ファイルだけに置き、端末へはgemini-3.5-transcribe-liveとTEXT出力に固定した1回限りの短寿命トークンだけを渡す。録音PCMと生成音声は履歴へ保存せず、アプリが非アクティブになるか画面を閉じると録音と再生を停止する"
