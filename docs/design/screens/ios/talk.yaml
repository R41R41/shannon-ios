  privacy: "カメラを連続・自動・バックグラウンドで取得しない。ユーザーが撮影またはライブラリで選び、プレビューで承認した1枚だけを縮小・再エンコードして共有する。写真本体は会話履歴へ保存せず、表示履歴には写真共有の印だけを残す。友人の同意は本人が事前に得る（2026-10-02の決定）。「友人も一緒」は、本人の記憶・目的・作業・ノート・タスクの投影をモデルへ渡し、守るべき個人情報には印を付けて、話す前にモデル自身に確かめさせる（保証ではない）。内緒にと言われたこと・本人が手で機微にしたもの・名前を聞いていない人との通話・忘れたことは、モデルへ渡さない。音声コマンドと、本人の目標・約束・事実の抽出は行わない。通話中の会話は端末のメモリ上だけに持ち、時間が終わる時（「本人だけ」へ戻す・通話を終える）に一度だけサーバーへ送る。サーバーは名前・やり取りの文字・短い要約・その人が自分について話したこと・約束・次に話したいことを人の記憶として保存し、本人のトーク・経験・プロフィール・約束・目的には入れない。音声は保存しない。「今回は残さない」でその通話の記録と、その通話で初めて覚えた人を消す。時間の途中でアプリが終了した場合、その時間は残らない。「本人だけ」で同席者がいると本人が言った間は、「友人も一緒」と同じ確かめ方で話し、操作を行わず、その間の発言から本人について学ばない。声で人を聞き分けない。声で「本人だけ」へ戻すことはできない。Geminiの永久APIキーはAzureの0600秘密ファイルだけに置き、端末へはgemini-3.5-transcribe-liveとTEXT出力に固定した1回限りの短寿命トークンだけを渡す。録音PCMと生成音声は履歴へ保存しない。明示的に開始した通話は小型化、アプリ内画面移動、他アプリ表示中もマイクと再生を継続し、通話中表示と終了操作を提供する。明示的な終了で録音と再生を停止し、電話などの音声割り込みはiOSの許可に従って再開する"

