schema_version: 1
screen_id: shannon-ios-work
platform: ios
baseline_commit: 3a8751a7d4c5f433a881b0bbb13107eafc95ab29
last_verified_at: 2026-10-01
user_job: "複数の作業を把握し、対象プロジェクト・実行先・モデルを選んで安全にCodexへ依頼する"
primary_action: "開始前の作業環境を確認し、この設定で作業を始める"
verification_scope: "2026-10-01（止まった作業と終了した作業）: 状態語の統一、続きが必要の先頭カードと再開ボタン、終了作業の『次にできること』、変更／検証／未解決の報告、許可しないの意味と確認、確認済みの扱いをSwift単体テスト（ShannonAgentTaskAttentionTests）とiOS／Macビルドで確認。新しいカードと確認ダイアログの実表示・実タップ・Dark・VoiceOver・大きい文字・Reduce Motion、実ホストでの『許可しない』後の継続は未確認。下の証跡画像は変更前の文言（判断待ち、判断が必要）を写している。2026-10-01（判断を最上部に）: 個別作業画面の並び替え、サブタイトル、完了工程の畳み込み、指示欄の見た目変更をSwift単体テスト（サブタイトル文言・完了工程の行構成）、iOS／Macのビルド、iOS 27.0 Simulator（iPhone 17、Light）の合成承認と合成計画（完了5・実行中1・未着手2）の表示で確認。標準サブタイトル、承認カードが先頭に来ること、完了工程が一行に畳まれること、指示欄の見た目を目視した。実タップでの開閉、Dark、VoiceOver、大きい文字、Reduce Motionは未確認。下の証跡画像は変更前の並びを写しており、新しい画像は保存していない。2026-10-01: 承認カードの長押し確認をiOS 27.0 Simulatorの合成承認で確認。外部接続の承認（Light）とコマンド承認（Dark）の表示、『この作業中』の実タップで確認ダイアログが開くこと、1.2秒の実長押しでダイアログなしに決定処理が呼ばれること（プレビューは通信先がないため送信失敗の表示になる）を確認。作業提案カードのボタンが標準・特大文字とも1行で縦積みになることを確認。Reduce Motion中の長押し表示とVoiceOver操作は未確認。2026-09-30〜10-01: 個別作業の計画タイムラインをiOS 27.0 Simulatorの合成タスクでLight／Darkの表示確認（完了5・実行中1・未着手2）。実行中工程の詳細展開部と大きい文字での計画は画面外で未確認。展開・折りたたみの実タップとVoiceOver実読み上げは未確認。以前の記録: 既存の表示証跡はbaselineのもの。2026-09-29の音声通話からの作業確認・開始導線と小型通話バーは新規変更で、実表示・実タップ確認は未完了。提案・明示開始・重複配送と状態保持はSwift回帰で別途確認する"
vocabulary:
  rule: "1つの状態に1つの語。iPhone、Mac、通知、プッシュ、会話プロンプトの作業投影で同じ語を使う。実装は ShannonAgentTaskStatus.japaneseName と ShannonAgentTask.stateName、サーバーは agentTaskVocabulary.ts"
  states:
    proposed: "提案"
    queued: "準備中"
    starting: "準備中"
    running: "作業中"
    waiting_approval: "許可待ち"
    paused_needs_owner: "続きが必要（ホストが次の一手を残して止まり、持ち主の対応を待っている）"
    paused_by_owner: "一時停止中（持ち主が自分で止めた）"
    completed: "完了"
    failed: "失敗"
    cancelled: "中止"
  groups:
    attention_filter: "対応待ち（許可待ち・続きが必要・失敗）"
    active_filter: "進行中"
    proposed_filter: "提案"
    finished: "終了（完了・失敗・中止）"
    sections: "いま／これから／終了"
  operations:
    grant_once: "今回だけ許可（通知では「許可」）"
    grant_for_task: "この作業中"
    decline_one_operation: "許可しない（その操作だけを断り、作業は続く）"
    decline_and_stop: "許可せず作業を中止（実行先が操作単位の拒否に対応していない時だけ）"
    resume: "作業を再開"
    pause: "作業を一時停止"
    cancel: "作業を中止"
  results: "変更／検証／未解決。検証結果を「確認」と呼ばない"
  host_status: "利用可能／使用中／オフライン（実行先の状態に「作業中」を使わない）"
preserve:
  - "agent_tasksとイベント列を作業状態の正本とする"
  - "個別作業画面の承認、指示、一時停止、再開、中止"
improve:
  - "作業がない時もドロワーから作業全体へ移動できる"
  - "Macと同じ意味分類を、片手で読める一列構成へ変換する"
  - "一覧はApple標準のListとSection、開始設定はFormとPicker、作業操作はtoolbarのMenuを使う"
  - "開始前にAether・Shannon・Voyagerを含むプロジェクト、Local優先の実行先、対応モデルと思考レベルを選ぶ"
  - "自動実行は利用できるLocal Hostを優先し、選択した固定ホストを黙って切り替えない"
  - "開始条件を満たさないプロジェクトまたは実行先では開始操作を無効化し、安全側に倒す"
  - "個別作業では直近の動きを常に表示し、完全な履歴は必要な時だけ展開する"
  - "アーカイブ済み作業はiPhoneで中・大の標準シートとして表示する"
  - "音声通話を継続したまま実装案・作業詳細を開ける。案を確認するだけでは作業を開始しない"
  - "個別作業画面（作業の詳細と承認）は判断を最上部に置く。上から、ナビゲーションの作業名と状態・進捗のサブタイトル（例『許可待ち・5/8工程』）、承認カードまたは一行の状態行、続きが必要なら『次にあなたがすること』、操作エラー、終了した作業なら『次にできること』、止まった・終了した作業の報告（変更／検証／未解決）、計画、直近のコマンド、最新の動き、全作業記録の順にする。作業中に変更や検証結果がある時は、従来どおり末尾に置く。進捗はサブタイトルと計画に集約し、大きいヒーローと5段階表示を独立したブロックとして置かない"
  - "承認待ちの時は承認カードをスクロール内容の先頭に置き、小さいシャノンのアバターと『シャノンが許可を待っています』を見出しにし、種類の固定タイトル・理由・許可する対象（コマンド・パス・接続先）を示す。新しい承認が届いたら先頭へ戻す。承認がない時はアバター・現在の動き・段階名の状態行を先頭に置く"
  - "サブタイトルはiOS 26以降で標準のnavigationSubtitle、それ以前は中央のツールバー項目に二行で示す。文言はtaskのstatus・承認の有無・planのstatusだけから作る"
  - "計画が空でない時は『計画』見出しに『M/N 完了』と開閉を置き、縦のタイムラインを既定で開いて表示する。先頭から続く完了済み工程が2つ以上なら『M工程を完了』の一行に畳み、タップで展開する。完了はチェック付きの点と描き込まれる連結線、実行中は色面のブロック、未着手は番号付きの控えめな点で示す。工程の順序は並べ替えない"
  - "追加の指示欄はTalkの入力欄と同じ見た目にする。safeAreaInsetで下端に置き、素材の角丸の入力面の右端に円形の送信ボタンを置く。プレースホルダーは『シャノンへの追加の指示』のまま、送信の挙動は変えない"
  - "実行中の工程は直近のコマンド実行結果、最新の作業記録、検証結果の集計を展開表示し、タップで畳める。いずれも既存の永続イベントとテスト結果から取り、モデルの文章から進捗を推定しない"
  - "全作業記録は必要な時だけ展開する。計画は常時表示に移したため、展開部には重複して置かない"
  - "承認カードの『今回だけ許可』はコマンド実行・ファイル変更ではタップ、外部接続・権限では0.6秒の長押し。『この作業中』は常に長押し、長押しボタンのタップ・キーボード・VoiceOver操作は確認ダイアログを開き、長押しと同じ結果になる。許可する側の2択の意味と長押しの規則は変えない。カード下の補足は、タップすると確認してから決定することと、許可しない時に何が起きるかを必ず伝える"
  - "『許可しない』はその操作だけを断る。作業は中止されず、シャノンは別の進め方を探すか、次の一手を残して止まる（続きが必要）。これはタップ1回で行える。実行先が操作単位の拒否に対応していない時（承認にdenyContinuesが無い）は、ボタンを『許可せず作業を中止』にし、作業全体が止まって再開できないことを確認ダイアログで伝えてから送る"
  - "続きが必要で止まった作業は、状態行の直下に『次にあなたがすること』カードを置く。次の一手を全文で示し、『作業を再開』を画面上の主要ボタンにする（メニューの中だけにしない）。指示欄から指示を送るとその内容で再開することを補足で伝える。状態行は『続きにはあなたの対応が必要です』、持ち主が止めた時は『あなたが一時停止した作業です』と区別する"
  - "完了・失敗・中止した作業には『次にできること』を置く：『修正を頼む』『続きを頼む』『元のトークへ戻る』。終了した作業は命令を受け付けないので、前の2つは元のトークを開いて入力欄に下書きを入れるだけにし、送信は持ち主が行う。元のトークがこの端末に無い時は、その旨と頼み直し方を文で示す"
  - "止まった・終了した作業の報告は『変更』『検証』『未解決』の節で示す。変更は変更ファイル、検証は記録された検証結果、未解決は失敗・未実行の検証と（完了以外では）未完了の工程。すべて永続データから作り、モデルの文章から推定しない。空の節は出さない。要約は省略せず全文を出す。続きが必要・失敗で止まった作業も変更と検証結果を保持して表示する"
  - "一覧の行は、続きが必要の作業では『次：〈次の一手〉』を出し、許可待ちと同じ注意色のシンボルにする。節は『いま／これから／終了』、絞り込みは『すべて／対応待ち／進行中／提案／終了』"
  - "並んだボタンは文字が1行に収まる時だけ横並びにし、収まらない時は全幅で縦に積む。ボタン内の文字は折り返さない"
do_not_change:
  - "ユーザー承認の境界"
  - "完了・失敗・中止を履歴から黙って削除しない"
  - "専用の配信ゲートなしにTestFlight、ASC、実機インストールが完了したと表示しない"
states:
  loading: "前回表示を保ったまま更新する"
  empty: "作業の開始方法を案内する"
  error: "最後に取得できた一覧を保ち、個別画面で再試行可能にする"
  offline: "キャッシュされた作業を表示し、最新とは断定しない"
  conflict: "サーバーの新しいイベント列を優先する"
  selection: "状態名、シンボル、位置を併用し、プロジェクト・実行先・モデル・思考をラベル付きPickerで示す"
  approval_hold: "長押し中は塗りが左から伸び、途中で離すと戻る。完了で成功の触覚。送信中は3択を隠して送信中を示す。Reduce Motionでは塗りの代わりに『押し続けています… N%』と枠線で示す"
  plan_timeline: "工程の状態はplanのstatusだけで決める。完了・進行中・未着手を形と文言でも区別し、見出しに『M/N 完了』を併記する。先頭の完了済み工程は既定で一行に畳み、実行中の工程は詳細を開いて表示する"
  approval_first: "承認が保留中の間、承認カードは常にスクロール内容の先頭にあり、状態行は出さない。承認が解決したら状態行に戻る"
  needs_owner: "状態行、『次にあなたがすること』（次の一手と『作業を再開』）、報告、計画の順。再開の送信中はボタンに送信中を出して無効にする"
  finished: "状態行（要約全文）、『次にできること』、報告、計画、記録の順。指示欄と作業操作メニューは出さない"
  acknowledgement: "作業画面で見た結果・停止だけが確認済みになる。画面を開いている間に状態が変わった時も、見えている状態を確認済みにする。許可待ちは開いても確認済みにならない"
  decline_stops_task: "『許可せず作業を中止』のタップで確認ダイアログを出す。『戻る』では何も送らない"
  voice_review: "実装案から同じ開始設定へ進み、通話バーから詳細へ戻るか明示的に終了できる。ゲストには所有者の作業を出さない"
accessibility:
  dynamic_type: "タイトルと現在地を二行まで表示し、行全体をタップ可能にする。個別作業の状態行はアクセシビリティサイズで段階名を下に積む"
  voiceover: "長押しボタンは名前と『長押しで決定します。タップすると確認してから決定します』を読み、ダブルタップで確認ダイアログを開く。承認カードは見出し『シャノンが許可を待っています』から読み、許可する対象を『許可する対象、〈対象〉』と読む。『許可しない』は『この操作だけを断ります。作業は中止されません』をヒントで伝える。『次にあなたがすること』は見出し・次の一手・再開ボタンの順に読む。『修正を頼む』『続きを頼む』は下書きを入れるだけで送信しないことをヒントで伝える。計画の見出しは『計画』と『全N工程中M工程完了』を読み、開閉をヒントで伝える。畳んだ完了工程は『完了した工程』とM工程完了を読む。各工程は『工程N: 名前』と完了・進行中・未着手を値で読み、進行中の展開時は詳細も読む。作業名、状態、現在地、進捗、実行先、課金経路、開く操作をまとめて伝える"
  target_size: "作業行、計画の見出し、畳んだ完了工程の行、送信ボタンを44ポイント以上にする"
  focus: "一覧から個別画面、戻るの順序を維持する"
  reduce_motion: "状態変化をアニメーションだけで伝えない。計画の連結線とブロックはReduce Motion時に短い切替にし、脈動させない。計画と完了工程の開閉は0.35秒の減衰スプリング、Reduce Motion時は0.15秒のease-outにする。承認到着時の先頭への移動はReduce Motion時にアニメーションしない"
