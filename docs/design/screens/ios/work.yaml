schema_version: 1
screen_id: shannon-ios-work
platform: ios
baseline_commit: 3a8751a7d4c5f433a881b0bbb13107eafc95ab29
last_verified_at: 2026-10-01
user_job: "複数の作業を把握し、対象プロジェクト・実行先・モデルを選んで安全にCodexへ依頼する"
primary_action: "開始前の作業環境を確認し、この設定で作業を始める"
verification_scope: "2026-10-01: 承認カードの長押し確認をiOS 27.0 Simulatorの合成承認で確認。外部接続の承認（Light）とコマンド承認（Dark）の表示、『この作業中』の実タップで確認ダイアログが開くこと、1.2秒の実長押しでダイアログなしに決定処理が呼ばれること（プレビューは通信先がないため送信失敗の表示になる）を確認。作業提案カードのボタンが標準・特大文字とも1行で縦積みになることを確認。Reduce Motion中の長押し表示とVoiceOver操作は未確認。2026-09-30〜10-01: 個別作業の計画タイムラインをiOS 27.0 Simulatorの合成タスクでLight／Darkの表示確認（完了5・実行中1・未着手2）。実行中工程の詳細展開部と大きい文字での計画は画面外で未確認。展開・折りたたみの実タップとVoiceOver実読み上げは未確認。以前の記録: 既存の表示証跡はbaselineのもの。2026-09-29の音声通話からの作業確認・開始導線と小型通話バーは新規変更で、実表示・実タップ確認は未完了。提案・明示開始・重複配送と状態保持はSwift回帰で別途確認する"
preserve:
  - "agent_tasksとイベント列を作業状態の正本とする"
  - "個別作業画面の承認、指示、一時停止、再開、中止"
improve:
  - "作業がない時もドロワーから作業全体へ移動できる"
  - "Macと同じ意味分類を、片手で読める一列構成へ変換する"
  - "一覧はApple標準のListとSection、開始設定はFormとPicker、作業操作はtoolbarのMenuを使う"
  - "開始前にAether・Shannon・Voyagerを含むプロジェクト、Local優先の実行先、対応モデルと思考レベルを選ぶ"
  - "自動実行は利用できるLocal Hostを優先し、選択した固定ホストを黙って切り替えない"
  - "開始条件を満たさないプロジェクトまたは実行先では開始操作を無効化し、安全側に倒す"
  - "個別作業では直近の動きを常に表示し、完全な履歴は必要な時だけ展開する"
  - "アーカイブ済み作業はiPhoneで中・大の標準シートとして表示する"
  - "音声通話を継続したまま実装案・作業詳細を開ける。案を確認するだけでは作業を開始しない"
  - "個別作業では既存の5段階表示を残し、計画が空でない時は『計画』セクションに縦のタイムラインを常時表示する。完了はチェック付きの点と描き込まれる連結線、実行中は色面のブロック、未着手は番号付きの点で示す"
  - "実行中の工程は直近のコマンド実行結果、最新の作業記録、検証結果の集計を展開表示し、タップで畳める。いずれも既存の永続イベントとテスト結果から取り、モデルの文章から進捗を推定しない"
  - "全作業記録は必要な時だけ展開する。計画は常時表示に移したため、展開部には重複して置かない"
  - "承認カードの『今回だけ許可』はコマンド実行・ファイル変更ではタップ、外部接続・権限では0.6秒の長押し。『この作業中』は常に長押し、『許可しない』は常にタップ。長押しボタンのタップ・キーボード・VoiceOver操作は確認ダイアログを開き、長押しと同じ結果になる。3択の意味は変えない"
  - "並んだボタンは文字が1行に収まる時だけ横並びにし、収まらない時は全幅で縦に積む。ボタン内の文字は折り返さない"
do_not_change:
  - "ユーザー承認の境界"
  - "完了・失敗・中止を履歴から黙って削除しない"
  - "専用の配信ゲートなしにTestFlight、ASC、実機インストールが完了したと表示しない"
states:
  loading: "前回表示を保ったまま更新する"
  empty: "作業の開始方法を案内する"
  error: "最後に取得できた一覧を保ち、個別画面で再試行可能にする"
  offline: "キャッシュされた作業を表示し、最新とは断定しない"
  conflict: "サーバーの新しいイベント列を優先する"
  selection: "状態名、シンボル、位置を併用し、プロジェクト・実行先・モデル・思考をラベル付きPickerで示す"
  approval_hold: "長押し中は塗りが左から伸び、途中で離すと戻る。完了で成功の触覚。送信中は3択を隠して送信中を示す。Reduce Motionでは塗りの代わりに『押し続けています… N%』と枠線で示す"
  plan_timeline: "工程の状態はplanのstatusだけで決める。完了・進行中・未着手を形と文言でも区別し、全N工程中M工程完了を併記する"
  voice_review: "実装案から同じ開始設定へ進み、通話バーから詳細へ戻るか明示的に終了できる。ゲストには所有者の作業を出さない"
accessibility:
  dynamic_type: "タイトルと現在地を二行まで表示し、行全体をタップ可能にする"
  voiceover: "長押しボタンは名前と『長押しで決定します。タップすると確認してから決定します』を読み、ダブルタップで確認ダイアログを開く。計画は『工程N: 名前』と完了・進行中・未着手を値で読み、進行中の展開時は詳細も読む。作業名、状態、現在地、進捗、実行先、課金経路、開く操作をまとめて伝える"
  target_size: "作業行を44ポイント以上にする"
  focus: "一覧から個別画面、戻るの順序を維持する"
  reduce_motion: "状態変化をアニメーションだけで伝えない。計画の連結線とブロックはReduce Motion時に短い切替にし、脈動させない"
