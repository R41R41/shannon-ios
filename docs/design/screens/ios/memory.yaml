schema_version: 1
screen_id: shannon-ios-memory
platform: ios
baseline_commit: a84f898
last_verified_at: 2026-10-02
verification_scope: "2026-10-02（鉛筆の訂正・忘れる確認の説明）: サーバーの回帰テストとswift test、Debugビルドで確認。実機での訂正操作と翌日の表示は未確認。2026-10-01（いま＋分類リスト）: 合成fixtureの純ロジック（分類件数、読み込み中・失敗時の値、いまの気分・考えていること・続けている目的の抽出）をswift testで確認し、iOS Debugビルドが通ることを確認。Simulator・実iPhoneでの表示、実タップ、VoiceOver実読み上げ、目的状態変更は未確認。Macは従来の概要構成のまま"
user_job: "頭の中で、いまのシャノン（気分・考えていること・続けている目的）をひと目で確かめ、約束と目的・覚えていること・ふたりの関係・日記・見つけたものを分類から開いて確認・管理する"
primary_action: "いまカードの続けている目的、または分類の行から目的と記憶を開き、確認・一時停止・完了・再開する"
preserve:
  - "いま・知識・記憶の概要、日記、活動表示"
  - "サーバー正本と既存の記憶変更API"
improve:
  - "覚えていることの鉛筆での訂正は、記憶の詳細の訂正と同じ『あなたの訂正』として記録する。同じ発言や夜の整理で元の内容へ戻らず、記憶の管理と会話にも訂正後の内容が使われる。上限320文字と現在の文字数を入力欄の下に示す"
  - "忘れる時の確認に、これより前のシャノンの返答が今後の会話の材料から外れることを1文で説明する"
  - "最初に知性の面のいまカードを置き、小さなシャノンの目、現在の気分、いま考えていることを1行、続けている目的を最大3件表示する"
  - "いまカードの目的を押すと既存の目的管理（確認・一時停止・完了・取り下げ・再開）を開く。目的が無い・読み込めない時も目的管理への行を残す"
  - "inset-groupedの分類リスト（約束と目的、覚えていること、ふたりの関係、日記、見つけたもの）に件数と開示記号を出し、各ページは既存の部品を再利用する"
  - "覚えていることのページに性格分析・興味・知識（訂正可能）を集め、上部に記憶の管理入口を置く"
  - "使用量と活動を別グループの行にし、AI使用量・最近の自発性・重複候補の除外・活動履歴（今日・今週・それ以前）を1ページにまとめる"
  - "活動や知識が豊富でも管理入口（記憶の管理）を分類リストに常に表示する"
  - "未完了・終えた約束、保存した記憶、忘れた・否定した記憶から詳細へ進める"
  - "復元対象は物理削除ではないことを分類リストの説明と管理画面で説明する"
  - "明示された継続目的と最近の認知サイクルを所有者が確認できる"
  - "目的を一時停止・完了・取り下げ・再開して次の対話に反映できる"
  - "明示目標から作られた次の一手と最大5段階の計画案を、実行記録と混同せず確認できる"
do_not_change:
  - "所有者スコープと外部アプリ承認の境界"
  - "シャノンが根拠なく目的を完了扱いすること"
  - "計画案を実行済み・完了済みとして扱うこと"
states:
  loading: "いまカード・分類の行・記憶の管理を表示したまま、件数の位置に進行表示を出す"
  empty: "分類の行は件数0で残し、開いたページで何が残る場所かを説明する。目的が無い時もいまカードに目的管理への行を残す"
  error: "記憶と認知を独立して扱う。認知の失敗はいまカード内、記憶の失敗は分類リスト内と各ページで再試行でき、前回の一覧と件数を保持する"
  offline: "前回の記憶・目的と件数を保持し、未保存の状態変更を成功扱いにしない"
  conflict: "目的の再開競合を説明し、再読み込みして整理できる"
  selection: "memory IDで記憶詳細を、intent IDで目的状態を保持し、変更後も履歴に到達できる"
accessibility:
  dynamic_type: "いまカード・目的・分類名・件数・記憶・次の一手・計画案・認知要約は複数行で伸長する"
  voiceover: "いまカードは気分と考えていることを文字で読み上げ、目は装飾として読み上げない。分類は名前と件数（読み込み中・読み込めませんでした）を読み上げる。目的本文、明示状態、次の一手、番号付き計画案、変更メニュー、認知結果を文字とアイコンで提供する"
  target_size: "行の最小高は44ポイント"
  focus: "標準NavigationLink・List・Menuで一覧、状態変更、戻るを提供する"
  reduce_motion: "導線と状態の理解に装飾アニメーションを使わない。いまカードの目はReduce Motionで静止する"
evidence:
  current:
    - "docs/screenshots/shannon-ios-memory-hub-error-light-v1.png"
  approved: []
  privacy: "合成fixtureのみ。実会話・個人情報・credentialを含めない"
