user_job: "頭の中で、いまのシャノン（気分・考えていること・続けている目的）をひと目で確かめ、約束と目的・覚えていること・ふたりの関係・日記・見つけたものを分類から開いて確認・管理する"
primary_action: "いまカードの続けている目的、または分類の行から目的と記憶を開き、確認・一時停止・完了・再開する"
preserve:
  - "いま・知識・記憶の概要、日記、活動表示"
  - "サーバー正本と既存の記憶変更API"
  - "ようすのいま／学び／気分、頭の中の記憶・約束・目的・人・書斎の既存入口"
improve:
  - "分類リストに「人」を置く。「友人も一緒」で会った人の名前、最後に話した日、覚えていることの件数を一覧し、名前を聞いていない通話は「名前を聞いていない方」にまとめる。人を開くと、その人のこと・話したことの要約・約束・次に話したいことを、それぞれ『〇〇さんと一緒の時・日付・機微／ふつう』付きで示す"
  - "人の画面で、名前の変更（前の名前は別の呼び方として残る）、ほかの人との統合（元に戻せないことを確認で伝える）、内容ごとの忘れる・復元、人ごとの忘れる・復元、内容ごとの機微／ふつうの切り替えができる。忘れる・統合は確認を挟む"
  - "人はDiscordなどの会話からも増える。人の詳細に「話した場所」（音声・Discord…）を示し、内容には『友人グループ（Discord）で話した時』のように場所を示す。同じ名前の人が別にいる時は「同じ名前の〇〇さん（Discord）と統合…」を提案として示し、シャノンは自分ではまとめない。忘れる・復元は音声とDiscordのどちらの内容にも同じように効く"
  - "記憶の詳細に『ほかの人がいる場での扱い』を示す：話した時（ライ氏と二人の時／〇〇さんと一緒の時／グループの会話）、機微かふつうか、その理由（シャノンが内容から判断・ライ氏が選んだ・区別を記録する前の記憶）。『ふつうにする／機微にする』で切り替えられる。手で機微にしたものは、ほかの人がいる場ではシャノンにも渡さない（確実に出ない）。ふつうにしたものは印なしで使う。内容からの判断で機微になっているものは、シャノンが話す前に確かめる対象になる"
  - "分類リストの上に『シャノンのやりたいこと』を置く。シャノン自身の目標・問い・作品を最大3件、種類と状態つきで示し、押すと全件（理由、出どころ、ノートや下書きへのリンク、使うモデル）を開く。所有者の『続けている目的』とは別の節にして混ぜない"
  - "やりたいことは読むだけ。所有者ができる変更は、種（はじめに決めた目標と動機）以外の項目に『休ませる』『やめてもらう』を伝えることだけで、やめてもらう時は確認を出す"
  - "同じ節の『したことの記録』から、自律活動の状態（準備中／動いています／一時停止中／今日は予算を使い切りました）と一時停止、今日の予算（使った額／上限）、シャノンからの予算のお願い（今日だけ増やす額を選ぶ／見送る）、シャノンからの提案（開始は確認つき／見送る）、日ごとの記録（その日の1行まとめ、いつ・何を・どの範囲で・どのモデルや道具で・いくらで・結果・承認の要否）を開く"
  - "『シャノンのやりたいこと』の節に『書斎』の行を置き、物語とメモの件数を示す。押すと、物語・メモ・しまったものの一覧を開く。シャノンが『見せてもいい』と決めていない物語は、題名も本文も出さず『作っているものがあります』とだけ示す"
  - "書斎の作品を開くと、題名・状態（下書き／見せてもいい／見せた／しまった）・稿の番号と本文を読める。物語には稿ごとの『直したこと』（何を変えたか、なぜか）、メモには読んだページへのリンクを添える。シャノンが直している途中は、見せてくれた稿を出し、直している途中だと文で伝える"
  - "物語には感想を残せる。『好き／もう少し／よく分からない』から1つ選び、ひとこと（400文字まで、なくてもよい）を添えて送る。送った感想は、シャノンが次に直す時に渡されるか、もう読んだかを添えて一覧に残る。サーバーが保存を返すまで送ったことにしない"
  - "『しまってもらう』は確認を出してから伝える。しまっても文章と記録は残ることを文で示す"
  - "『したことの記録』の日ごとのまとめは、その日にしたことの短い文（例: 次にすることを考え、公開ページを2つ読み、メモを2つ書きました）と使った費用で示す。書斎に何かを書いた記録の行からは、その作品を開ける"
  - "記録は追記だけで、画面に編集・削除の操作を置かない"
  - "いまカードの気分は、サーバーが示す今の会話感情の表情名（落ち着いた後は穏やかなどの静かな表情）。固定の気質の最大値を気分として出さない"
  - "状態の詳細の好奇心と親密さは、動かしている根拠を1行で添える（例: この30日で12日話した・守れた約束3件（90日以内）、いま育っている関心2件）。自発性・落ち着き・継続欲求は根拠がないため状態として表示しない"
  - "覚えていることの鉛筆での訂正は、記憶の詳細の訂正と同じ『あなたの訂正』として記録する。同じ発言や夜の整理で元の内容へ戻らず、記憶の管理と会話にも訂正後の内容が使われる。上限320文字と現在の文字数を入力欄の下に示す"
  - "忘れる・事実ではない・訂正の説明は、その内容と、その内容に触れたシャノンの返答や要約だけが今後の会話の材料から外れ、ほかの返答や要約はそのまま使われ、復元すると元に戻ることを短く伝える（記憶の詳細の確認、鉛筆の訂正、記憶の管理の一覧、忘れた記憶の詳細）"
  - "忘れた・事実ではないと指定した項目は覚えていることの一覧に出さず、記憶の管理から復元できる。約束を復元すると忘れる前の状態（未完了など）に戻る"
  - "最初に知性の面のいまカードを置き、小さなシャノンの目、現在の気分、いま考えていることを1行、続けている目的を最大3件表示する"
  - "いまカードの目的を押すと既存の目的管理（確認・一時停止・完了・取り下げ・再開）を開く。目的が無い・読み込めない時も目的管理への行を残す"
  - "inset-groupedの分類リスト（約束と目的、覚えていること、ふたりの関係、日記、見つけたもの）に件数と開示記号を出し、各ページは既存の部品を再利用する"
  - "覚えていることのページに性格分析・興味・知識（訂正可能）を集め、上部に記憶の管理入口を置く"
  - "使用量と活動を別グループの行にし、AI使用量・最近の自発性・重複候補の除外・活動履歴（今日・今週・それ以前）を1ページにまとめる"
  - "活動や知識が豊富でも管理入口（記憶の管理）を分類リストに常に表示する"
  - "未完了・終えた約束、保存した記憶、忘れた・否定した記憶から詳細へ進める"
  - "復元対象は物理削除ではないことを分類リストの説明と管理画面で説明する"
  - "明示された継続目的と最近の認知サイクルを所有者が確認できる"
  - "目的を一時停止・完了・取り下げ・再開して次の対話に反映できる"
  - "明示目標から作られた次の一手と最大5段階の計画案を、実行記録と混同せず確認できる"
  - "ADR-0008 Stage5は既存の頭の中に「関心の日記」を加え、いまの関心と朝の変更を分けて読む。ようすのいま／学び／気分と既存の記憶・目的管理を保つ"
  - "関心の変更は前後の版・理由を固定して残す。選んだ朝の変更だけを戻すとその関心の自動更新を止め、「自動更新を再開する」で明示再開する。固定と解除、禁止と解除、忘れるは個別の確認を経て送る。禁止解除だけでは自動更新停止を解除しない"
  - "関心詳細の「参考にした記録」は現在の開示・忘却境界で許された原文だけを示す。表示しない／いま確認できない状態を区別し、内部traceや実行証明の中身を出さない"
do_not_change:
  - "所有者スコープと外部アプリ承認の境界"
  - "シャノンが根拠なく目的を完了扱いすること"
  - "計画案を実行済み・完了済みとして扱うこと"
  - "シャノンのやりたいことを所有者の目的の台帳に混ぜること、所有者が項目を追加・書き換えること"
  - "シャノンの文章（題名・本文）を所有者が書き換えられるようにすること、見せてもいいと言っていない物語の題名や本文を表示すること"
  - "したことの記録を書き換える・消す操作を置くこと"
states:
  loading: "いまカード・分類の行・記憶の管理を表示したまま、件数の位置に進行表示を出す"
  empty: "分類の行は件数0で残し、開いたページで何が残る場所かを説明する。目的が無い時もいまカードに目的管理への行を残す。人が0人の時は、通話を「友人も一緒」にして名前を言うか、Discordなどでシャノンと話すと残ること、声で聞き分けないことを説明する"
  people: "人の一覧は記憶・認知と独立に読み込む。読み込めない時は前回の一覧を残して再試行でき、変更に失敗した時は保存されていないことを示す。人の記憶に未対応のサーバーでは空の一覧を示す"
  error: "記憶と認知を独立して扱う。認知の失敗はいまカード内、記憶の失敗は分類リスト内と各ページで再試行でき、前回の一覧と件数を保持する"
  offline: "前回の記憶・目的と件数を保持し、未保存の状態変更を成功扱いにしない"
  conflict: "目的の再開競合を説明し、再読み込みして整理できる。予算のお願いや提案が別の端末で決められていた時は、最新の状態を読み直して説明する"
  autonomy_unavailable: "サーバーが自律の経路を持たない時は『シャノンのやりたいこと』の節を出さない。接続の失敗は節を残して説明する"
  study_unavailable: "サーバーが書斎の経路を持たない時は『書斎』の行を出さない。接続の失敗は行を残して説明する。何もない時は、ここに並ぶものを文で示す"
  study_reaction_failed: "感想やしまうお願いを保存できなかった時は、保存されていないことを文で伝え、選んだ内容は残す"
  autonomy_pause: "一時停止の表示は、サーバーが保存を返してから切り替える。保存に失敗した時は、まだ止まっていないことを文で伝える"
  selection: "memory IDで記憶詳細を、intent IDで目的状態を保持し、変更後も履歴に到達できる"
  stage5_unavailable: "未対応・無効・権限不足の403/404では新しい関心入口を隠す。通常の記憶管理やようすの既存入口を失わない"
  stage5_unknown: "POSTの結果が不確定な時は元operationIdのGETだけで届いたか確認し、再POSTしない。関心detailと変更detailのどちらにも確認導線を置く"
  stage5_conflict: "409の確定拒否では最新の関心と変更履歴を読み直す。古い版を成功扱いにしない"
  stage5_audience: "既存のbody／voiceが同席者を知った時に新しい関心本文・変更・根拠を即時に隠し、古い非同期応答で戻さない"
  stage5_forgotten: "忘れた内容は現在項目・過去の変更・操作結果・根拠のすべてで再検査して表示しない"
accessibility:
  dynamic_type: "いまカード・目的・分類名・件数・記憶・次の一手・計画案・認知要約は複数行で伸長する 関心の理由・変更前後・根拠も複数行に伸長する。製品本文に文字サイズ上限を設けない"
  voiceover: "いまカードは気分と考えていることを文字で読み上げ、目は装飾として読み上げない。分類は名前と件数（読み込み中・読み込めませんでした）を読み上げる。目的本文、明示状態、次の一手、番号付き計画案、変更メニュー、認知結果を文字とアイコンで提供する 関心の状態は固定／禁止／自動更新は停止中の文字でも示し、確認内容と戻るを標準コントロールで提供する"
  target_size: "行の最小高は44ポイント"
  focus: "標準NavigationLink・List・Menuで一覧、状態変更、戻るを提供する iPhoneの標準NavigationLink・List・確認ダイアログで現在表示中の詳細から確認し、元画面まで戻る操作を保持する"
  reduce_motion: "導線と状態の理解に装飾アニメーションを使わない。いまカードの目はReduce Motionで静止する"
