last_verified_at: 2026-10-02
verification_scope: "2026-10-02（活動の状態）: 状態4種（準備中／動いています／一時停止中／今日は予算を使い切りました）の文言と、状態を持たない旧サーバーでの表示をswift testとDebugビルドで確認。実機での表示とVoiceOver実読み上げは未確認。 2026-10-02（シャノンのやりたいこと・したことの記録）: 合成fixtureでのDTO解読・状態ラベル・所有者に許す操作の判定・一時停止と予算依頼と提案の決定の流れをswift testで確認し、iOS DebugとMac Debugのビルドが通ることを確認。Simulator・実機での表示、実タップ、Dynamic Typeでの折り返し、VoiceOver実読み上げ、実サーバーとの往復は未確認。 2026-10-02（いまの気持ちと気質の根拠）: 表示値の出どころと文言をswift testとDebugビルドで確認。実機での表示とVoiceOver実読み上げは未確認。2026-10-01（プロフィール＋現在値）: 現在値ラベル（外観、アプリアイコン、アバター、声、読み上げ、接続）の純ロジックをswift testで確認し、iOS Debugビルドが通ることを確認。Simulator・実iPhoneでの表示、実タップ、VoiceOver実読み上げは未確認"
user_job: "表示や接続を壊さず、シャノンのプロフィール（アバター・声・読み上げ）を確かめ、見た目・声と会話・接続と詳細を現在値を見ながら選ぶ"
primary_action: "見た目のアプリアイコン行からL02、L06、L10を選ぶ"
preserve:
  - "会話、接続、音声、情報源、配信、診断への設定導線"
  - "Light、Dark、Systemの外観設定"
  - "声の変更は進行中の会話へ割り込まず、次の音声会話から反映する"
  - "ライブ音声の利用済み記録を消さず、当日追加分を別に記録する"
improve:
  - "『シャノンの自律』の節に、自律活動の一時停止（オンで停止。サーバーが保存を返してから表示が変わる）と現在の状態（準備中／動いています／一時停止中／今日は予算を使い切りました）、『したことの記録』への行（確認待ちの件数、または今日の使った額／上限）を置く"
  - "現在の状態は、活動の仕組みが動いているかどうかまで示す。準備中（サーバーで有効でない、または専用のAPIキーが未設定、または活動の仕組みが動いていない）／動いています／一時停止中／今日は予算を使い切りました。節の下の説明文も状態に合わせる"
  - "一時停止中も会話・音声・記憶・所有者が始めた作業は動くことを、節の説明で伝える"
  - "プロフィール行の『いま』は、サーバーが示す今の気持ちの名前だけを出す（状態の版番号は出さない）。状態詳細は今の気持ちとその理由、親密さ・好奇心とそれぞれの根拠、活性、心の開きを示す"
  - "アプリアイコンは持ち主が選ぶL02・L06・L10の3択だけで、シャノンの感情や外観には連動しない"
  - "最上部にシャノンのプロフィール行（現在のアバター、シャノン、「声：<声>・<読み上げ>」、いまの表情）を置き、押すと既存の状態詳細を開く"
  - "セクションを利用者の目的で「見た目」「声と会話」「接続と詳細」に分け、各行の右側に現在値を表示する"
  - "見た目: 外観（システム／ライト／ダーク）、アプリアイコン（例: L06）、アバター（表情アイコン／2つ目のアイコン）"
  - "声と会話: 声（現在の声と「次の通話から反映」の副文）、読み上げ（Gemini／ElevenLabs v4 Turbo）。反映時点の説明は段落行ではなく短い副文とフッターにする"
  - "接続と詳細: 接続（接続中・未接続など）、情報源、配信（TestFlight）、診断（音声診断）。既存の設定先はすべて残す"
  - "実際の3候補を画像、レベル、説明と選択状態で示す"
  - "L06を標準・おすすめとして明示する"
  - "選択中の声を維持し、既定ONではリモート再生だけを+50 centsにする。ロボ加工とマイク入力の加工はしない"
  - "チャット中のシャノンのアバターだけを表情アイコンと2つ目のアプリアイコン（L06）から選べる。ホーム画面のアプリアイコン選択とは独立させる"
do_not_change:
  - "Bundle ID、署名、URL scheme、CloudKit、保存データの識別子"
states:
  loading: "切替中は進行表示を出し、重複操作を防ぐ"
  empty: "該当なし。3候補を常に表示する"
  error: "現在の選択を保ち、切替失敗を再操作可能な文で示す"
  offline: "アイコン切替は端末内で完結する"
  conflict: "OSが返す現在のalternate iconを正として再表示する"
  autonomy_pause: "保存に失敗した時は切り替えず、まだ止まっていないことを文で伝える。サーバーが自律の経路を持たない時は節を出さない"
  selection: "選択中をチェック、枠、読み上げで示し、設定一覧では各行の右側に現在値を示す"
  voice_name: "Geminiの声はサーバー設定のため、同じ読み上げ方式の通話で声名が分かるまでは「サーバー設定の声」と表示する。ElevenLabsは「Shannonクローン」と表示する"
  voice_audition: "試聴ボタンは置かない。既存の試聴機能は廃止済みのリアルタイム声選択APIに属し、サーバーが410を返すため"
  tts_provider: "GeminiまたはElevenLabs v4 Turboの選択中を示し、次の通話から反映する。ElevenLabs未設定時はエラーを表示し、Geminiへの暗黙の切替で測定値を混ぜない"
  allowance_retired: "ライブ音声の残り時間と60分追加は表示しない。対応するリアルタイム音声枠APIは廃止済み（サーバーが410を返す）で、Gemini音声会話に当日枠の取得・追加APIが無いため"
accessibility:
  dynamic_type: "レベル名、説明、現在値は必要に応じて複数行にする"
  voiceover: "プロフィールは名前・声・読み上げ方式・表情と状態詳細を開くことを、各行は項目名と現在値を読み上げる。候補名、レベル、選択状態、読み上げプロバイダーと次の通話からの適用を読み上げる"
  target_size: "候補カード全体と設定の各行を44ポイント以上の操作領域にする"
  focus: "シートを閉じても設定一覧へ戻る"
  reduce_motion: "切替状態を動きだけで表現しない"
