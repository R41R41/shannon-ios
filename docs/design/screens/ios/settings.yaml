last_verified_at: 2026-10-09
verification_scope: "2026-10-09（実ペアリングscope修正候補）: 合成URLSessionと共通Swift28件/2 suiteでlocal-ownerの会話とserver owner資格情報のGET/PUT、期限切れ・別server・scope/token/server交換と遅延応答、401/403/404/503の読取失敗とGETだけの再確認を検証。既存表示・配色・操作、会話cache identity、scope照合・CAS・結果不明PUT再送禁止は保持。候補の署名なしgeneric iOS Debugビルド成功、共通Swift全体777 XCTest+209 Swift Testing件を直列で再確認。候補のiOS実画面・実機・配布は未確認。 2026-10-09（判断モデル）: 共通Swiftの合成fixture（24件・2 suite）で読取・CAS保存・端末間共有・重複送信禁止・結果不明のGET確認・利用不可・404未対応・資格情報変更と遅延応答・独自モデル設定の正直な表示を検証。iPhone 17/iOS 26.5の隔離SimulatorでLightのHaiku→Sonnet選択と確認済み表示、DarkのSonnet利用不可の理由・無効化を実操作・AX・画面で確認。Dynamic Type拡大、Increase Contrast、Reduce Motion、VoiceOver実読み上げ、実サーバーとの往復、物理iPhoneの受入れは未確認。DEBUGの専用プレビューは実認証・API・ゲームを使わない。 2026-10-02（カレンダーの予定をシャノンに伝える）: 対応づけ（繰り返し予定のID・終日・文字数の上限・300件と並び順・辞退した予定の除外）、送信内容の形、オフ時のDELETEと空PUTへの切替、404の扱い、変更通知のまとめと間隔、状態の文言をswift testで確認。iOS DebugとMac Debugのビルド、Simulator（iPhone 17）のデザインプレビュー（-ShannonPreviewSettings -ShannonPreviewCalendar sent／permission）で『最終送信』と『権限がありません』の表示を確認。実機、実際のカレンダー権限の確認画面、EventKitの実読み取り、実サーバーとの往復、実タップでの切替、Dynamic Type、VoiceOver実読み上げは未確認。 2026-10-02（活動の状態）: 状態4種（準備中／動いています／一時停止中／今日は予算を使い切りました）の文言と、状態を持たない旧サーバーでの表示をswift testとDebugビルドで確認。実機での表示とVoiceOver実読み上げは未確認。 2026-10-02（シャノンのやりたいこと・したことの記録）: 合成fixtureでのDTO解読・状態ラベル・所有者に許す操作の判定・一時停止と予算依頼と提案の決定の流れをswift testで確認し、iOS DebugとMac Debugのビルドが通ることを確認。Simulator・実機での表示、実タップ、Dynamic Typeでの折り返し、VoiceOver実読み上げ、実サーバーとの往復は未確認。 2026-10-02（いまの気持ちと気質の根拠）: 表示値の出どころと文言をswift testとDebugビルドで確認。実機での表示とVoiceOver実読み上げは未確認。2026-10-01（プロフィール＋現在値）: 現在値ラベル（外観、アプリアイコン、アバター、声、読み上げ、接続）の純ロジックをswift testで確認し、iOS Debugビルドが通ることを確認。Simulator・実iPhoneでの表示、実タップ、VoiceOver実読み上げは未確認"
user_job: "表示や接続を壊さず、シャノンのプロフィール（アバター・声・読み上げ）を確かめ、見た目・声と会話・接続と詳細を現在値を見ながら選ぶ"
primary_action: "判断モデルで通常（Haiku 5.5）または高精度（Sonnet 5.5）を選び、確認済みの設定を見る"
preserve:
  - "会話、接続、音声、情報源、配信、診断への設定導線"
  - "Light、Dark、Systemの外観設定"
  - "声の変更は進行中の会話へ割り込まず、次の音声会話から反映する"
  - "ライブ音声の利用済み記録を消さず、当日追加分を別に記録する"
improve:
  - "（2026-10-09）『声と会話』の次に『判断モデル』。通常（Haiku 5.5）／高精度（Sonnet 5.5）の標準ボタン行で選び、サーバーで確認した現在値にチェックを付ける。初回の未取得を通常モードの保存済み表示に置き換えない。iPhoneとMacで共通、次に始まる処理から反映、高精度は費用が高め、と短く伝える。適用先は応答のappliesToだけを表示し、未接続のMinecraft適用を断定しない"
  - "モデルの読込中／保存中は進行表示と重複操作の禁止、利用不可は理由、未対応サーバーは節の説明を示す。保存の応答を失ったら前回値を保持してGETだけで確認し、再送しない。読み直せるまで選択を止める。設定の再表示と次のactive時に読み直し、資格情報やscopeが変わった古い応答は採用しない"
  - "（A5、2026-10-05）プロフィール行の下に区画『管理』: 運用（印と理由の1行。報告が1度も届いていない間は『運用の報告は、まだ届いていません。』）、接続中の端末（端末の一覧とほかの端末の解除だけを開く）、配信、診断。『接続と詳細』の区画は無く、その下に 接続（この端末の接続の状態・確認・この端末の解除と、最初の接続）と 情報源。接続中の端末と接続は、同じ画面を開かない（docs/product/information-architecture.md の 1）"
  - "（A6、2026-10-05）区画『すがた』: 姿（水の光の目／Live2Dの姿）、体（人の姿／目だけ。2026-10-05、所有者の決定。目だけを選ぶと、その下に説明『水色の目が 2 つだけのシャノンです（水の光の目と同じ動き）。…』）、映し方（全身／上半身）、位置を戻す、トークで姿を見る（設定を閉じてトークの向き合う表示を出す）、体に起きたことをシャノンに伝える（既定はオフ。入切はここにだけ置く）、触れたときの返事（文字で返す／声で返す）と説明。体と位置を戻すはLive2Dの姿のときだけ、映し方はLive2Dの姿で人の姿のときだけ使え、目だけのときは説明の最初の文が『目だけのときは、目のあたりを軽くつつけます（なでる・くすぐる・手をつなぐは、ありません）。』になり、触れたときの返事は伝える設定がオンでLive2Dの姿のときだけ選べる（docs/design/screens/ios/body.yaml）"
  - "『予定』の節に『カレンダーの予定をシャノンに伝える』のスイッチを1つ置く（既定はオフ）。行の副文に現在の状態（送っていません／まだ送っていません／送信中…／最終送信 M月D日 HH:MM・N件／権限がありません／サーバーが未対応です。対応したら自動で送ります／送れませんでした。次の機会にもう一度送ります／シャノンに接続すると送れます／送った予定の削除を待っています。接続できたときに削除します）を示す"
  - "『予定』の節の下の説明で、送るもの（予定の題名・時刻・場所・カレンダー名、これから14日ぶん）、使いみち（シャノンが予定を知って、声をかけたり答えたりするため）、送らないもの（メモ・参加者・URL）、オフにすると送った予定をサーバーから削除することを伝える"
  - "カレンダーの権限がない時だけ『カレンダーの権限を設定で開く』のボタンを出す。まだ尋ねていない時はシステムの確認を出し、拒否済みの時はシステムの設定を開く"
  - "『シャノンの自律』の節に、自律活動の一時停止（オンで停止。サーバーが保存を返してから表示が変わる）と現在の状態（準備中／動いています／一時停止中／今日は予算を使い切りました）、『したことの記録』への行（確認待ちの件数、または今日の使った額／上限）を置く"
  - "現在の状態は、活動の仕組みが動いているかどうかまで示す。準備中（サーバーで有効でない、または専用のAPIキーが未設定、または活動の仕組みが動いていない）／動いています／一時停止中／今日は予算を使い切りました。節の下の説明文も状態に合わせる"
  - "一時停止中も会話・音声・記憶・所有者が始めた作業は動くことを、節の説明で伝える"
  - "プロフィール行の『いま』は、サーバーが示す今の気持ちの名前だけを出す（状態の版番号は出さない）。状態詳細は今の気持ちとその理由、親密さ・好奇心とそれぞれの根拠、活性、心の開きを示す"
  - "アプリアイコンは持ち主が選ぶL02・L06・L10の3択だけで、シャノンの感情や外観には連動しない"
  - "最上部にシャノンのプロフィール行（現在のアバター、シャノン、「声：<声>・<読み上げ>」、いまの表情）を置き、押すと既存の状態詳細を開く"
  - "セクションを利用者の目的で「見た目」「声と会話」「接続と詳細」に分け、各行の右側に現在値を表示する"
  - "見た目: 外観（システム／ライト／ダーク）、アプリアイコン（例: L06）、アバター（表情アイコン／2つ目のアイコン）"
  - "声と会話: 声（現在の声と「次の通話から反映」の副文）、読み上げ（Gemini／ElevenLabs v4 Turbo）。反映時点の説明は段落行ではなく短い副文とフッターにする"
  - "接続と詳細: 接続（接続中・未接続など）、情報源、配信（TestFlight）、診断（音声診断）。既存の設定先はすべて残す"
  - "実際の3候補を画像、レベル、説明と選択状態で示す"
  - "L06を標準・おすすめとして明示する"
  - "選択中の声を維持し、既定ONではリモート再生だけを+50 centsにする。ロボ加工とマイク入力の加工はしない"
  - "チャット中のシャノンのアバターだけを表情アイコンと2つ目のアプリアイコン（L06）から選べる。ホーム画面のアプリアイコン選択とは独立させる"
do_not_change:
  - "Bundle ID、署名、URL scheme、CloudKit、保存データの識別子"
states:
  model_mode: "確認済み現在値／未確認／読込中／保存中／利用不可／未対応／通信失敗／版の競合／結果不明を区別する。保存失敗・不明で未確認の選択を表示せず、前回値を保つ。現在値のGETは自身のPUTの成功証拠とは言わない。サーバー指定モデルがHaiku 5.5／Sonnet 5.5と異なるときはその標準行へ選択チェックを付けず、実IDを現在の設定として示す。認証・scope変更では旧値を消し、送信前と応答後にpaired資格情報を照合する"
  calendar_sharing: "オフの間はカレンダーを読まず、何も送らない。オンにした時だけシステムの権限確認を出す。権限がなくてもスイッチはオンのまま『権限がありません』と設定への導線を示す。サーバーが経路を持たない時（404）はスイッチを保ち『サーバーが未対応です』と示して次の同期で再試行する。オフにすると読み取りを止めてサーバーの予定を削除し、届かなかった削除は保留して再試行する。接続を解除すると先に削除してオフに戻る。未接続の端末ではオンにできない"
  loading: "切替中は進行表示を出し、重複操作を防ぐ"
  empty: "該当なし。3候補を常に表示する"
  error: "現在の選択を保ち、切替失敗を再操作可能な文で示す"
  offline: "アイコン切替は端末内で完結する"
  conflict: "OSが返す現在のalternate iconを正として再表示する"
  autonomy_pause: "保存に失敗した時は切り替えず、まだ止まっていないことを文で伝える。サーバーが自律の経路を持たない時は節を出さない"
  selection: "選択中をチェック、枠、読み上げで示し、設定一覧では各行の右側に現在値を示す"
  voice_name: "Geminiの声はサーバー設定のため、同じ読み上げ方式の通話で声名が分かるまでは「サーバー設定の声」と表示する。ElevenLabsは「Shannonクローン」と表示する"
  voice_audition: "試聴ボタンは置かない。既存の試聴機能は廃止済みのリアルタイム声選択APIに属し、サーバーが410を返すため"
  tts_provider: "GeminiまたはElevenLabs v4 Turboの選択中を示し、次の通話から反映する。ElevenLabs未設定時はエラーを表示し、Geminiへの暗黙の切替で測定値を混ぜない"
  allowance_retired: "ライブ音声の残り時間と60分追加は表示しない。対応するリアルタイム音声枠APIは廃止済み（サーバーが410を返す）で、Gemini音声会話に当日枠の取得・追加APIが無いため"
accessibility:
  dynamic_type: "レベル名、説明、現在値は必要に応じて複数行にする"
  voiceover: "プロフィールは名前・声・読み上げ方式・表情と状態詳細を開くことを、各行は項目名と現在値を読み上げる。候補名、レベル、選択状態、読み上げプロバイダーと次の通話からの適用を読み上げる"
  target_size: "候補カード全体と設定の各行を44ポイント以上の操作領域にする"
  focus: "シートを閉じても設定一覧へ戻る"
  reduce_motion: "切替状態を動きだけで表現しない"
