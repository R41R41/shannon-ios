schema_version: 1
screen_id: shannon-web-gemini-voice-lab
platform: web
baseline_commit: c40eb9da36495c3730347ca164282ae417d4574b
last_verified_at: 2026-09-26
user_job: "iPhoneアプリを再配信せず、Shannonの日本語音声を同条件で比較し、作ったVoice IDを会話と実測遅延でも確認する"
primary_action: "同じ日本語台本で声を絞り、Voice DesignのVoice IDを音声認識・返答・ストリーミングTTSのカスケードで聴き比べる"
preserve:
  - "Geminiの恒久APIキーをAzureのmode-0600秘密ファイルから出さない"
  - "既存のiPhone音声モード、会話履歴、声設定をラボから変更しない"
  - "通常の試聴音声、台本、Live音声、文字起こしをサーバーへ保存しない"
  - "同じ台本を使う公平な比較と、モデル・声・スタイル・料金目安の識別を保つ"
improve:
  - "TTS比較を主導線にし、Live会話確認を任意の最終確認として分離する"
  - "生成した最大8候補をタブ内だけの比較トレイへ並べ、個別保存と破棄を可能にする"
  - "Voice Designの保存期間・課金・枠を明示し、確認後だけ作成する"
  - "人物・既存キャラクターの複製ではなく、年齢感・声質・話速・抑揚・感情表現に分解した9種の設計プリセットを選び、作成前に自由編集できる"
  - "Voice Designは日本語 / 英語と短文 / 詳細の4設計文を切り替え、同じキャラクター意図への影響を比較できる"
  - "日常・喜び・強気・慰め・決意・固有名詞・感情レンジの日本語台本と、短いアニメ調演技指示を独立して選べる"
  - "作成した複数のVoice IDをタブ内で並べ、各候補の正確なIDを再入力して個別に削除できる"
  - "保存済みVoice IDの削除は正確なID再入力を要求する"
  - "Liveは一回限りの短命トークン、ブラウザAEC、16kHz入力、24kHz出力を使う"
  - "LiveではVoice IDと独立した10種の演技プロファイルを選び、同じ声のまま日常会話の感情・間・語尾を比較できる"
  - "9種のVoice Design意図を対応するLiveプロファイルとして再現し、自然体を比較基準として残す"
  - "Shannonのポンコツ天才メイド人格は、恒久的な声質、会話生成の人格と少数例、ターン単位の短いTTS演技へ分離して適用する"
  - "作成済みVoice IDをGemini 3.5 Transcribe Live、短いGeminiテキスト応答、Gemini 3.8 TTSストリームへ渡すブラウザ限定カスケードを用意する"
  - "カスケードでは返答文、TTS先頭、認識確定から先頭音までの実測値をターンごとに表示する"
  - "既定ではブラウザAECを使って返答生成中・再生中も認識を続け、ライの発話を認識したら生成と再生を中断して次ターンへ移る。反響が強い環境では交互会話へ戻せる"
  - "MacからSSHトンネルを開く一つのコマンドで、公開URLなしにアクセスできる"
do_not_change:
  - "ラボからShannonの本番Voice設定、会話、Memory、データベースへ書き込まない"
  - "恒久APIキー、短命トークン、台本、音声、文字起こしをログへ書かない"
  - "Voice Designの作成・削除を確認なしに実行しない"
  - "TTSで選んだカスタムVoice IDがGemini Liveでも同じ音になると暗黙に約束しない"
states:
  loading: "声一覧と設定の取得中も既定候補と入力内容を保持し、実行操作だけを進行表示にする"
  empty: "比較トレイ、Voice Design結果、Live文字起こしに次の一操作を短く示す"
  error: "入力を保ち、機密を含まない上流エラーと再試行可能性を同じ領域に表示する"
  offline: "SSHトンネルまたはAzureラボへ到達できないことをGeminiの生成失敗と区別する。HTMLをfile URLで直接開いた場合は外観を保ち、操作を無効化して正規の起動コマンドとloopback URLを案内する"
  conflict: "同じ種類の生成が実行中なら二重送信を拒否し、完了後の再試行を案内する"
  selection: "選択中のモデル、声、台本、話し方を色だけでなく標準control状態と文言で示す"
  generated: "音声時間、生成時間、概算料金、モデル、同条件内の回数を添えて比較トレイ先頭へ追加する。セットの一部が失敗しても成功分を保持する"
  preset_verification: "既知プリセットの日本語 / 英語と短文 / 詳細の各組合せは実APIで作成・即時削除した検証日を示し、自由編集後は未検証であることと安全拒否時の修正方針を示す"
  live: "選択した声と演技プロファイルの組合せ、接続準備、会話中、停止、エラーを文言で示し、停止時にマイク・再生・WebSocketを閉じる"
  cascade: "認識中、返答生成中、音声生成中、再生中、割り込み認識中、再待機を文言で示す。割り込み時は進行中のHTTP要求と再生予約を止め、停止時にマイク・再生・WebSocket・HTTP要求を閉じる"
accessibility:
  dynamic_type: "ブラウザ拡大と狭幅で1列に再配置し、入力・結果・Liveの順序を保つ"
  voiceover: "入力ラベル、選択値、進行状態、話者付き文字起こし、破壊操作の対象IDを読み上げる"
  target_size: "主要ボタンと選択操作を最低44 CSSピクセル相当にする"
  focus: "見出し、モデル、声、台本、話し方、生成、結果、Designプリセット、設計文、保存確認、Live、カスケードの順でキーボード移動できる"
  reduce_motion: "状態をグローや動きだけに依存せず、文言と標準control状態を常に併用する"
evidence:
  current: []
  approved: []
  privacy: "架空の既定台本と空の比較状態だけを保存可能な証跡とし、実際の音声・文字起こし・Voice ID・トークンを含めない"
