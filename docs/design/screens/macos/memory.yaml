user_job: "頭の中から記憶・約束・継続目的、その次の一手と計画案、認知結果を確認し、必要な状態変更を行う"
primary_action: "継続目的を開き、確認・一時停止・完了・再開する"
preserve:
  - "Mac sidebarと会話・開発・作業の構成"
  - "いま・知識・記憶の概要、日記、活動表示"
improve:
  - "分類リストの上に『シャノンのやりたいこと』を置く。シャノン自身の目標・問い・作品を最大3件、種類と状態つきで示し、押すと全件（理由、出どころ、ノートや下書きへのリンク、使うモデル）を開く。所有者の『続けている目的』とは別の節にして混ぜない"
  - "やりたいことは読むだけ。所有者ができる変更は、種（はじめに決めた目標と動機）以外の項目に『休ませる』『やめてもらう』を伝えることだけで、やめてもらう時は確認を出す"
  - "同じ節の『したことの記録』から、自律活動の状態（準備中／動いています／一時停止中／今日は予算を使い切りました）と一時停止、今日の予算（使った額／上限）、シャノンからの予算のお願い（今日だけ増やす額を選ぶ／見送る）、シャノンからの提案（開始は確認つき／見送る）、日ごとの記録（その日の1行まとめ、いつ・何を・どの範囲で・どのモデルや道具で・いくらで・結果・承認の要否）を開く"
  - "『シャノンのやりたいこと』の節に『書斎』の行を置き、物語とメモの件数を示す。押すと、物語・メモ・しまったものの一覧を開く。シャノンが『見せてもいい』と決めていない物語は、題名も本文も出さず『作っているものがあります』とだけ示す"
  - "書斎の作品を開くと、題名・状態（下書き／見せてもいい／見せた／しまった）・稿の番号と本文を読める。物語には稿ごとの『直したこと』（何を変えたか、なぜか）、メモには読んだページへのリンクを添える。シャノンが直している途中は、見せてくれた稿を出し、直している途中だと文で伝える"
  - "物語には感想を残せる。『好き／もう少し／よく分からない』から1つ選び、ひとこと（400文字まで、なくてもよい）を添えて送る。送った感想は、シャノンが次に直す時に渡されるか、もう読んだかを添えて一覧に残る。サーバーが保存を返すまで送ったことにしない"
  - "『しまってもらう』は確認を出してから伝える。しまっても文章と記録は残ることを文で示す"
  - "『したことの記録』の日ごとのまとめは、その日にしたことの短い文（例: 次にすることを考え、公開ページを2つ読み、メモを2つ書きました）と使った費用で示す。書斎に何かを書いた記録の行からは、その作品を開ける"
  - "記録は追記だけで、画面に編集・削除の操作を置かない"
  - "覚えていることの鉛筆での訂正は、記憶の詳細の訂正と同じ『あなたの訂正』として記録する。同じ発言や夜の整理で元の内容へ戻らず、記憶の管理と会話にも訂正後の内容が使われる。上限320文字と現在の文字数を入力欄の下に示す"
  - "忘れる・事実ではない・訂正の説明は、その内容と、その内容に触れたシャノンの返答や要約だけが今後の会話の材料から外れ、ほかの返答や要約はそのまま使われ、復元すると元に戻ることを短く伝える（記憶の詳細の確認、鉛筆の訂正、記憶の管理の一覧、忘れた記憶の詳細）"
  - "忘れた・事実ではないと指定した項目は覚えていることの一覧に出さず、記憶の管理から復元できる。約束を復元すると忘れる前の状態（未完了など）に戻る"
  - "rich dashboardでも記憶と約束の管理入口を常設する"
  - "管理入口の下に「人」の入口を置き、覚えている人数と名前を1行で示す。開くとiPhoneと同じ人の一覧・人の詳細（その人のこと・話したことの要約・約束・次に話したいこと、『〇〇さんと一緒の時・日付・機微／ふつう』）を標準Listで表示し、名前の変更・統合・忘れる・復元・機微／ふつうの切り替えができる"
  - "記憶の詳細に『ほかの人がいる場での扱い』（話した時・機微／ふつう・理由）を示し、切り替えられる。手で機微にしたものは、ほかの人がいる場ではシャノンにも渡さない"
  - "完了・取り消し済みや忘れた記憶も一覧から詳細へ進める"
  - "継続目的と最近の認知履歴を一覧し、目的状態を明示操作で変更する"
  - "明示目標から作られた次の一手と最大5段階の計画案を、実行証拠と区別して表示する"
do_not_change:
  - "サーバー正本、記憶変更API、他アプリへの承認境界"
  - "認知履歴を非公開の思考過程として記録・表示すること"
  - "計画案を自動実行または完了の証拠として扱うこと"
  - "シャノンのやりたいことを所有者の目的の台帳に混ぜること、所有者が項目を追加・書き換えること"
  - "シャノンの文章（題名・本文）を所有者が書き換えられるようにすること、見せてもいいと言っていない物語の題名や本文を表示すること"
  - "したことの記録を書き換える・消す操作を置くこと"
states:
  loading: "記憶・目的の管理入口を保持し読み込み状態を示す"
  empty: "記憶4分類と目的3分類を説明付きで表示する"
  error: "記憶と認知の前回データをそれぞれ保持し更新を再試行できる"
  offline: "前回取得状態と未保存の状態変更を区別する"
  conflict: "同じ目的の再開競合を説明し、再読み込みで整理できる。予算のお願いや提案が別の端末で決められていた時は、最新の状態を読み直して説明する"
  autonomy_unavailable: "サーバーが自律の経路を持たない時は『シャノンのやりたいこと』の節を出さない。接続の失敗は節を残して説明する"
  study_unavailable: "サーバーが書斎の経路を持たない時は『書斎』の行を出さない。接続の失敗は行を残して説明する。何もない時は、ここに並ぶものを文で示す"
  study_reaction_failed: "感想やしまうお願いを保存できなかった時は、保存されていないことを文で伝え、選んだ内容は残す"
  autonomy_pause: "一時停止の表示は、サーバーが保存を返してから切り替える。保存に失敗した時は、まだ止まっていないことを文で伝える"
  selection: "memory IDで記憶詳細を、intent IDで目的状態を保持する"
accessibility:
  dynamic_type: "記憶・目的・次の一手・計画案・認知要約を必要に応じて複数行で表示する"
  voiceover: "目的本文、明示状態、次の一手、番号付き計画案、変更メニュー、認知結果をひとまとまりで提供する"
  target_size: "主要行は44ポイント以上"
  focus: "標準List・NavigationLink・Menuによるキーボード移動と状態変更を保つ"
  reduce_motion: "意味伝達を動きだけに依存させない"
