last_verified_at: 2026-10-05
verification_scope: "2026-10-05（A12、設定 › 管理）: 区画の並びと、運用の無いサーバーでの戻り先をShannonDeskTests、運用の印の規則を共通のswift test、Mac Debugのビルドで確認。Mac実画面の表示、実サーバーの運用の報告、VoiceOver実読み上げは未確認。 2026-10-02（カレンダーの予定をシャノンに伝える）: iPhoneと共通の対応づけ・送信内容・オフ時の削除・404の扱い・状態の文言をswift testで確認し、Mac Debugのビルドとテストが通ることを確認。Macでの画面表示、サンドボックス下のカレンダー権限の確認画面、EventKitの実読み取り、実サーバーとの往復、標準Settings Sceneでの表示、VoiceOver実読み上げは未確認。 2026-10-02（活動の状態）: 状態4種（準備中／動いています／一時停止中／今日は予算を使い切りました）の文言と、状態を持たない旧サーバーでの表示をswift testとDebugビルドで確認。実機での表示とVoiceOver実読み上げは未確認。 2026-10-02（シャノンのやりたいこと・したことの記録）: 合成fixtureでのDTO解読・状態ラベル・所有者に許す操作の判定・一時停止と予算依頼と提案の決定の流れをswift testで確認し、iOS DebugとMac Debugのビルドが通ることを確認。Simulator・実機での表示、実タップ、Dynamic Typeでの折り返し、VoiceOver実読み上げ、実サーバーとの往復は未確認。"
user_job: "Macの設定で、管理（運用・接続中の端末・配信・診断）と、すがた・カメラ・イヤホン・声・予定・外観・接続・情報源を選んで変える"
primary_action: "L02、L06、L10から実行中のDockアイコンを選ぶ"
preserve:
  - "外観、接続、音声、情報源の既存設定"
  - "L06をインストール直後とFinder表示の標準アイコンにする"
improve:
  - "設定は左に区画、右に中身（docs/product/information-architecture.md の 2）。先頭の『管理』に 運用・接続中の端末・配信・診断。続けて すがた・カメラ・イヤホン・声・予定・外観・接続・情報源（A12）"
  - "左の列の先頭に、シャノンのいまの顔と『いま：〈気持ち〉』の札。押すと状態のシート。外観に『アバター』（返事の横のアイコン）（A14）"
  - "運用の行は、確かめたいことがある間だけ橙の三角と理由の1行（『サーバーに届きません』『報告が届いていません』『〈名前〉が不調』『〈対象〉の操作が失敗／期限切れ』）。報告が一度も届いていない間は印を出さず『運用の報告は、まだ届いていません。』。サイドバーの 設定 の行にも同じ三角、その下に『運用：〈理由〉』の1行。押すと 設定 › 管理 › 運用"
  - "運用の操作は iPhone と同じ確認の文と長押し。Mac はポインターで押し続け、クリック・キーボード・VoiceOver では同じ文の確認"
  - "自律活動の止めるスイッチは シャノン › 自律活動 に置き、設定には置かない（iPhone の A4 と同じ）"
  - "『予定』の節に『カレンダーの予定をシャノンに伝える』のスイッチを1つ置く（既定はオフ）。行の副文に現在の状態（送っていません／まだ送っていません／送信中…／最終送信 M月D日 HH:MM・N件／権限がありません／サーバーが未対応です。対応したら自動で送ります／送れませんでした。次の機会にもう一度送ります／シャノンに接続すると送れます／送った予定の削除を待っています。接続できたときに削除します）を示す"
  - "『予定』の節の下の説明で、送るもの（予定の題名・時刻・場所・カレンダー名、これから14日ぶん）、使いみち（シャノンが予定を知って、声をかけたり答えたりするため）、送らないもの（メモ・参加者・URL）、オフにすると送った予定をサーバーから削除することを伝える"
  - "カレンダーの権限がない時だけ『カレンダーの権限を設定で開く』のボタンを出す。まだ尋ねていない時はシステムの確認を出し、拒否済みの時はシステムの設定を開く"
  - "現在の状態は、活動の仕組みが動いているかどうかまで示す。準備中（サーバーで有効でない、または専用のAPIキーが未設定、または活動の仕組みが動いていない）／動いています／一時停止中／今日は予算を使い切りました。節の下の説明文も状態に合わせる"
  - "アプリ内設定と標準Settings Sceneの両方から同じ選択画面を開く"
  - "実際の3候補を画像、レベル、説明と選択状態で示す"
do_not_change:
  - "Bundle ID、署名、URL scheme、CloudKit、保存データの識別子"
states:
  calendar_sharing: "オフの間はカレンダーを読まず、何も送らない。オンにした時だけシステムの権限確認を出す。権限がなくてもスイッチはオンのまま『権限がありません』と設定への導線を示す。サーバーが経路を持たない時（404）はスイッチを保ち『サーバーが未対応です』と示して次の同期で再試行する。オフにすると読み取りを止めてサーバーの予定を削除し、届かなかった削除は保留して再試行する。接続を解除すると先に削除してオフに戻る。未接続の端末ではオンにできない"
  loading: "切替中は進行表示を出し、重複操作を防ぐ"
  empty: "該当なし。3候補を常に表示する"
  error: "現在の選択を保ち、画像読込失敗を示す"
  offline: "アイコン切替は端末内で完結する"
  conflict: "保存済みレベルを正として起動時にDockへ再適用する"
  ops: "運用の経路が無いサーバーでは 運用 の行を出さず、管理は 接続中の端末 から始まる。接続が断られた時（401）は印を出さず『接続が無効になりました。もう一度接続してください。』"
  selection: "選択中をチェック、枠、読み上げで示す"
accessibility:
  dynamic_type: "説明が切れないよう設定シートをスクロール可能にする"
  voiceover: "候補名、レベル、選択状態を読み上げる"
  target_size: "候補カード全体を十分な操作領域にする"
  focus: "シートを閉じると呼び出し元の設定へ戻る"
  reduce_motion: "Dock変更の完了を動きだけで表現しない"
