  voiceover: "計画を『計画』としてまとめ、各工程を『工程N: 名前』と完了・進行中・未着手の値で読む。開閉ボタンは『詳細を開く』『詳細を閉じる』"
  target_size: "Mac標準のborderlessボタンとポインター操作の寸法に従う"
  focus: "キーボード移動で開閉ボタンへ到達でき、インスペクタの読み上げ順は上から下に保つ"
