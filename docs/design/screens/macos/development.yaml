schema_version: 1
screen_id: shannon-macos-development
platform: macos
baseline_commit: 603a88c9d0e1202bdc71a109a4a4b2caa0e5a29b
last_verified_at: 2026-09-24
user_job: "安全なCodex作業環境を選び、コード変更・コマンド・Git・ビルドの現在状態を一か所で確認する"
primary_action: "作業を選び、変更内容・実行結果を確認して次の指示または承認へ進む"
preserve:
  - "通常会話、音声、記憶、背景処理を開発作業から独立させる"
  - "作業開始と外部影響のある操作に既存の承認境界を残す"
  - "Aether、Shannon、Voyagerと共有する意味色を使い、製品固有の構成を保つ"
  - "選択したプロジェクトの絶対パスと認証情報をクライアントへ返さない"
improve:
  - "自動実行ではこのMacを優先し、利用できない場合だけCloud Agent Hostへ退避する"
  - "このMac固定をクラウドへ黙って切り替えない"
  - "Agent Hostが公開したモデルと対応する思考レベルだけを選べる"
  - "ファイルツリー、コマンド履歴、差分要約、ブランチ、ビルド結果を同じ作業に結びつける"
  - "HTTPSのGitHub URLからAgent Host専用の作業領域へリポジトリを追加する。自動ではLocalとCloudの双方へ複製し、片方の完了後すぐ選択できる"
  - "プロジェクト、実行先、モデル、思考はApple標準のtoolbarとMenuへ集約し、作業面の縦幅を圧迫しない"
  - "広幅では作業一覧と作業面を分割表示し、狭幅では一覧を上部のMenuへ自動的に畳んで内容を欠けさせない"
  - "ファイルはListとOutlineGroup、空状態はContentUnavailableView、差分は選択可能なファイル一覧と行単位レビューで表す"
  - "選択ファイルと差分本文はAgent Hostが作業領域を再検証して読み取り、短い内容も表示面の左上から始める"
  - "ターミナルとビルドはCodexへの指示欄と、実行中・完了・失敗を伴う上限付き出力として表す"
  - "同じファイルの途中経過が複数届いた場合は最新状態へ統合し、重複した差分カードを並べない"
  - "前回開いていた現在地インスペクタを起動時から復元し、開発画面の初期レイアウトと競合させない"
  - "大きな差分も行別の色分けとテキスト選択を保ったまま、表示範囲を遅延描画してレイアウトを安定させる"
  - "作業一覧は状態シンボルと文言を併用し、完了・中止・失敗を『終了』として正確にまとめる"
do_not_change:
  - "Agent Hostの設定済み領域または検証済み専用workspace外のディレクトリを開発対象にしない"
  - "Shannonの会話モデルに直接Git操作やシェル実行を任せない"
  - "Cloud Agent HostのAPI従量課金をローカル利用枠として表示しない"
states:
  loading: "直前のカタログと選択を保ち、更新操作だけを進行状態にする"
  empty: "作業ホストへの接続方法を示し、既存の会話と作業開始を妨げない"
  error: "取得済み情報を保ち、実行先が確認できない場合は新規開始を安全側に倒す"
  offline: "ローカルとクラウドを別々にオフライン表示し、自動選択の結果を説明する"
  conflict: "ホストの最新heartbeatを正本とし、選択モデルが非対応になった場合はホスト既定へ戻せる"
  permission: "非公開リポジトリを取得できない場合はGitHub権限の不足として安全な文言で失敗し、認証情報を画面やログへ返さない"
  resource_loading: "選択中のファイル名を保ったまま読み込み状態を示し、別ファイルの遅い応答で表示を上書きしない"
  resource_empty: "空ファイル、差分なし、未選択をそれぞれ固有の文言で示す"
  resource_blocked: "作業領域外、機密候補、バイナリは本文を返さず、理由と再試行だけを表示する"
  output: "実行出力は上限付きで追記し、状態を色だけでなく文言とシンボルでも示す"
  selection: "プロジェクト、実行先、モデル、思考、ツール、作業の選択を色以外でも判別できる"
accessibility:
  dynamic_type: "最小ウィンドウ幅では作業一覧をMenuへ畳み、検索・絞り込み・ツール選択・本文の順序とラベルを保つ"
  voiceover: "実行先の種別・状態・課金区分、Git状態、差分件数を読み上げる"
  target_size: "開始、更新、実行依頼、ブランチ、ビルドの操作領域を44ポイント以上にする"
  focus: "サイドバー、作業一覧、ツール、入力欄の順でキーボード移動できる"
  reduce_motion: "ホスト状態や進捗の意味を点滅や移動だけに依存させない"
evidence:
  current: []
  approved: []
  privacy: "design previewの架空プロジェクト・差分だけを保存し、実リポジトリの絶対パスやコード本文を含めない"
