verification_scope: "2026-10-07 第4段階: 隔離Mac Debugの合成fixtureをCUAで確認。Light/Darkの一覧、個別停止・全停止・停止後の再開、会話とすがたの入口、Escape後のフォーカス復帰、結果不明・停止確認中・5回失敗を確認。実サーバー・実音声・VoiceOver読み上げ・大きい文字は未確認。 2026-10-06（A16 の B、小さくした通話）: サイドバーの行の文と読み上げ、メニューバーに出る条件（通話中で窓が画面に無いとき）、メニューの項目、ミュートと終了の動きを swift test と Mac Debug のビルド、ナビゲーションの smoke で確認。メニューバーの実際の見え方、隠す・しまう・ほかの窓の後ろでの出入り、VoiceOver 実読み上げは未確認。 2026-10-06（A16 音声会話）: 通話の始め方・終わり方、最後の窓を閉じたときの終了、マイクの選択（名前、無いときの戻り方）、マイクを使う間はほかの声と音声入力が待つこと、友人も一緒では写真を共有しないこと、通話の間の姿の動きを swift test と Mac Debug のビルドで確認。実際のマイクと声（エコー、割り込み、マイクの切り替え、Mac のカメラ、音声入力）、Mac 実画面の帯の見え方、VoiceOver 実読み上げは未確認（所有者の耳と目が要る）。 2026-10-05（A13・A14）: 通知の文と出す規則、写真の用意（大きさ・JPEG・画像でないもの）を ShannonDeskTests と swift test、Mac Debug のビルドで確認。Mac 実画面の表示、写真ライブラリの選択、地図、通知の実際の表示と押したときの動き、VoiceOver 実読み上げは未確認。 2026-10-02（書斎へのカード）: シャノンが作品を見せるメッセージに付くカードのDTO解読とキャッシュの往復をswift test、Debugビルドで確認。実機でカードを押して書斎が開くこと、VoiceOver実読み上げは未確認。 2026-10-02（表情名の共有）: 共有の表を使うことをShannonDeskのDebugビルドとテストで確認。Mac実画面の表示は未確認。2026-10-02（取り込みの表示・リマインドの操作）: 合成fixtureのswift test（文言、日付の言い換え、後から届く取り込みの反映、取り消し・完了・あとでの呼び出し、旧サーバー・旧キャッシュの読み込み）とDebugビルドで確認。Simulator・実機での表示、実タップ、VoiceOver実読み上げ、大きい文字での見え方は未確認。2026-09-30の返信コード追加はShannonDeskのDebugビルドとShannonDeskTests（19件）で確認。Mac実画面の表示とコピー操作は未確認"
user_job: "シャノンとの会話を読み、入力し、添付やWeb調査を伴う返答を同じトークで継続する"
primary_action: "入力欄からメッセージを送信する"
preserve:
  - "会話履歴と選択中トークの復元"
  - "Shannon本文、ユーザー吹き出し、添付、出典、生成物、整理カードの区別"
  - "Light、Dark、Systemの既存外観"
  - "会話から作業と設定へ移動できるアプリシェル"
  - "右の補助パネルで会話の目次、作業の現在地、すがた を切り替えられる"
improve:
  - "ADR-0008第4段階: 裏の作業の小さな入口から標準シート／ポップオーバーで由来・状態・停止を読む。同席者は一般表示だけ。古い報告・復旧中・結果不明では新しい操作を送らず、不明な作業を自動再開しない。契約は docs/action-threads-contract.md。実装ブランチ、未配布"
  - "シャノンが書いた作品を見せるメッセージには、作品の題名と『書斎で読む』のカードを付ける。押すと、その作品を読む画面を開く。カードは会話の本文から作らず、サーバーが付けた参照だけから出す"
  - "表情の語はiPhoneと同じ共有の表を使う。Mac独自の言い換え（考えている、少し気になっている、穏やか、集中している、少し沈んでいる、少し困っている、楽しそう、親しみを感じている）は使わない"
  - "シャノンの返答の下に、その回で取り込んだことを静かな1行で示す（約束にしました／覚えました・覚え直しました・覚えています／目的にしました）。取り込みは返答の後に届くので、返答は待たせず、届いた時点で同じ返答の下に出る。再起動後や別の端末でも履歴と一緒に出る。何も取り込まなかった回には何も出さない"
  - "取り込みの行を押すと頭の中の同じ項目（記憶の詳細、または目的の管理）がシートで開く。行の「取り消す」は既存の記憶操作（約束の取り消し・記憶を忘れる・目的の取り下げ）を使い、記憶を忘れる時だけ影響（その内容と、その内容に触れた返答や要約だけが材料から外れ、復元すると元に戻ること）を説明して確認する"
  - "時刻ちょうどの知らせを頼まれた時は、約束の行に『時刻ちょうどにはお知らせできません。1日1回の声かけの枠でお知らせします』を添える。『30分後に教えて』やタイマーは約束にせず、できないことを1行で伝える"
  - "約束のリマインドの下に『完了にする／あとで』を出す。完了・あとで・取り消し済みの後は操作の代わりに結果を1行で示す。『あとで』は1日1回の枠の中でもう一度だけ声をかける"
  - "シャノンからの話は、Mac の通知でも知らせる（A13）。題は『シャノン』、本文は話そのもの。部屋を見た話は『ライ氏、部屋のことでひとことあります。』だけで、中身は出さない。押すとそのトークが開く"
  - "写真を1枚、写真ライブラリか画像のファイルから添付できる（ファイルと合わせて4件まで）。送る前に小さな写真と『写真を外す』を出す（A14）"
  - "返事に場所があるときは、iPhone と同じ地図のカード。空のトークには、話題の候補を3つまで（選ぶと入力欄に入り、送らない）"
  - "トークの上に、作業の知らせを1つ（許可待ち、続きが必要、結果の順）。押すと現在地。返事の横のアイコンは 設定 › 外観 › アバター に従う。サイドバーの下に『カメラ：切／見てよい／いま見ています』"
  - "補助パネルの3つめ『すがた』に、選んだ姿（水の光の目／Live2Dの姿）が立つ（A15）。幅は320から、目次・現在地とは切り替えで同時には出さない。ポインターで姿にそのまま触れ、ピンチか⌘＋スクロールで大きさ、スクロールで位置。姿の下に『いま：〈気持ち〉・〈していること〉』。パネルのメニューに 姿・体・映し方・位置を戻す。触れたことは、設定 › すがた の『伝える』が入のときだけ届き、ふだんはあなたひとり、音声会話が友人も一緒の間とそのあと5分はほかの人もいるものとして届く。声で返す のときは、言ったあと数秒聞き、答えると音声会話になる（A16）。トークの見出しのボタンと⌥⌘Fでも開く。すがた はトークの横だけに出し、シャノン・作業・設定 では隠して、トークに戻ると同じパネルが戻る（ページの幅を保つため。2026-10-05 の見直し）"
  - "音声会話（A16）は入力欄から始める（波の形のボタン『音声会話を開始』）。通話は入力欄の上の帯で、姿は会話の横の『すがた』（通話が始まると開く）。帯には、状態の 1 行（聞いています・考えています・シャノンが話しています・ミュート中・つなぎ直し・つながらなかった）、両方の最後のひとこと、通話の時間、ラベル付きの操作『マイク』『入力マイク』『写真』『本人だけ／友人も一緒』『終了』。つながらないときは『もう一度つなぐ』、マイクが許可されていないときは『システム設定を開く』"
  - "通話中は、入力欄に書いた文が通話に届く（右下は『⌘↩︎で通話に送る』）。添付のメニューは通話の間は使わない。送れなかった文は帯に出して『入力を再送』"
  - "入力マイクは Mac のマイクを名前で選ぶ（自動 = システムの入力）。選んだマイクが無い・使えないときは、システムの入力で続けて『（選んだマイクを使えません）』と出す。通話中に選び直すと、同じ通話をつなぎ直す"
  - "写真は、カメラで撮る（映像のシートで『撮る』。シャッター音は出さない）、写真ライブラリから選ぶ、ファイルから選ぶ。共有する前に小さな写真と『共有』『撮り直す／選び直す』『外す』。友人も一緒では、押すと共有できない理由を出す"
  - "本人だけ／友人も一緒 は iPhone と同じ確認と、残し方の説明のカードを通話の間ずっと出す。友人も一緒があった通話のあとは、帯の場所に『この通話を覚えました』と『今回は残さない』"
  - "通話で頼んだ作業の提案は帯に 1 行出し、押すと 現在地 で内容を見て始める"
  - "友人も一緒の間（調整役の決定 2026-10-06）は、トークの会話の代わりに中立の札『友人も一緒の通話中は、トークを隠しています』。トークの題・作業の知らせ・サイドバーのトークの一覧・目次・現在地も同じ札にし、自動で下へ送らない。姿のパネル、通話の帯、入力欄は残る。Mac の通知は、その間は出さず、終わってから出す。所有者が自分で開くページ（作業、シャノン › 頭の中、設定、開発と、そこから開くシート）は覆わない（所有者の決定 2026-10-06、information-architecture 8 #28）"
  - "ほかのアプリが前にある間も通話は続き、その間に 1 分お話が無いと終わってトークにそう出る。最後の窓を閉じると通話は終わる"
  - "通話中は、どのページでもサイドバーのいちばん下、カメラの状態の隣に『音声会話・〈いまの段階〉』と通話の時間、ミュート、終了の行。押すとトーク（所有者の決定 2026-10-06、B）"
  - "窓が画面に無い間（隠した・しまった・ほかの窓の後ろ）は、メニューバーに段階と時間。メニューに『トークに戻る』『ミュート』（ミュート中はチェック）『音声会話を終了する』。『トークに戻る』は最後に使った窓を前に出してトークを開く。通話が終わるか窓が戻ると消える。メニューバーの項目はアプリに 1 つで、A17 のメニューは同じ項目に区画を足す"
  - "入力欄のマイク（音声入力）は、押すと録り、もう一度押すと文字になって入力欄に入る。送るのは所有者。通話がマイクを使っている間は始めない。録っている間と、録り終えた声が文字になるのを待つ間は『音声会話を開始』を押せない（録った声を通話が黙って捨てない）"
  - "長い会話でも常設目次から依頼と回答内見出しへ移動でき、読み位置と入力状態を失わない"
  - "目次を開閉しても現在の見出しを画面中央付近に保ち、Reduce Motion時は移動アニメーションを使わない"
  - "補助操作と状態表示の視覚ノイズを抑える"
  - "ユーザー発言は送信時刻と配信状態を示し、直近の失敗はその場で再試行できる"
  - "回答は時刻と安全なHTTPS出典を表示し、出典を会話本文と区別する"
  - "現在のShannonはWaterlight Eyeの視線・瞬き・表情変化で静かに存在を示す"
  - "サイドバーは標準Listの選択と標準検索で、上に トーク／作業／シャノン、その下にトークの一覧、いちばん下に 設定 の 4 つの柱（A10）。開発と配信は作業の中のページで、ツールバーで切り替える"
  - "作業の未確認件数は色だけでなく数値と読み上げで示し、一覧の主情報量を圧迫しない"
  - "返信内のコードはiPhoneと同じ言語ラベル、コピー（NSPasteboard、押すと「コピー済み」）、15行以上の折りたたみと『残りN行を表示』、テキスト選択、横スクロールを持つ。操作はポインター向けの標準borderlessボタンで示す"
  - "構文色はShannonAppCoreの共通字句規則と意味色を使い、未知の言語は色なしで表示する"
do_not_change:
  - "会話、記憶、作業の正本と同期規則"
  - "ユーザー確認前にVoyagerやAetherへ書き込まない境界"
  - "既存の情報階層、意味色、全身ポートレート"
states:
  turn_capture: "取り込みは返答より後に届く。届くまでは何も出さず、進行表示もしない。忘れた・取り消した・取り下げた項目の行は消える。操作に失敗したら行の下に理由を出し、成功扱いにしない。ゲストの音声では出さない"
  loading: "履歴取得中であることを示し、入力済み内容を破棄しない"
  empty: "最初の会話を始められる入力欄と静かな案内を示す"
  error: "直前の表示可能な履歴を保ち、原因を秘密情報なしで示し、直近の送信失敗を再試行可能にする"
  offline: "ローカル表示キャッシュを保ち、未送信または再接続待ちを区別する"
  conflict: "新しいサーバー状態を優先して再読込し、ユーザー入力を黙って失わない"
  voice_call: "接続中・マイクの準備中も帯を出して『終了』で止められる。つながらない・許可が無いときは理由と次の一手を帯に出し、通話が生きているようには見せない。マイクを使う間は、イヤホンの声・触れたときの声・音声入力は待つ"
  selection: "選択中トーク、サイドバーの現在地、目次の現在位置、フォーカス中の操作を色以外でも判別できる"
accessibility:
  dynamic_type: "主要本文とラベルは拡大時にも切り捨てず、必要なら縦に伸びる"
  voiceover: "サイドバーの通話の行は『音声会話・聞いています、通話時間 3分12秒』のように読み、押すとトークに戻ることを手がかりで伝える。ミュートと終了は名前で読む。メニューバーの項目も同じ文を読む。音声会話の帯は状態の行をまとめて読み、操作は『マイク（オン／ミュート中）』『入力マイク、使用中: …』『音声会話を終了する』のように名前と状態で読む。取り込みの行は『約束にしました：明日 プレゼンの練習』のように内容ごと読み上げ、押すと頭の中で開くことをヒントで伝える。取り消し・完了にする・あとでは個別の操作として読み上げる。話者、本文、時刻、状態、ボタンの役割を読み上げ順に提供する"
  target_size: "主要操作のヒット領域を44ポイント以上にする"
  focus: "キーボード移動、入力欄、選択トークのフォーカスを予測可能に保つ"
  reduce_motion: "意味をアニメーションだけに依存させず、Reduce Motionで不要な移動を抑える"
