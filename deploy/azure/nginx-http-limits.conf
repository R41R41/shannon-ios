# The http-block part of nginx-location.conf (copy to /etc/nginx/conf.d/shannon-limits.conf). Per client address:
# the large-body routes (photos, speech, looks, folder reports) 2 requests a second with a burst of 6 and 3 connections; the
# vision worker 4 requests a second with a burst of 8 (a device sends one frame every 2 s, plus its status and presence).
limit_req_zone $binary_remote_addr zone=shannon_large_req:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=shannon_vision_req:1m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=shannon_large_conn:1m;
