# The http-block part of nginx-location.conf (copy to /etc/nginx/conf.d/shannon-limits.conf). One request zone and one
# connection zone per kind of route, per client address. All of the owner's devices share one home address, so each kind allows
# several devices at once (8 connections; the rates have room for a burst from all of them):
# - vision: the vision worker (a frame every 2 s per device, plus status and presence);
# - media: photos shared in a call and recorded speech (up to 4 MiB each; 8 x 4 MiB per address is the most nginx holds for them);
# - look: one frame of a body or app look (1 MiB);
# - report: her folder's step reports (1 MiB). Long polls are never in any zone.
limit_req_zone $binary_remote_addr zone=shannon_vision_req:1m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=shannon_vision_conn:1m;
limit_req_zone $binary_remote_addr zone=shannon_media_req:1m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=shannon_media_conn:1m;
limit_req_zone $binary_remote_addr zone=shannon_look_req:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=shannon_look_conn:1m;
limit_req_zone $binary_remote_addr zone=shannon_report_req:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=shannon_report_conn:1m;
