# The operator socket's directory (docs/operator-minecraft-contract.md). Every unit but the API hides it with
# InaccessiblePaths=, which fails a unit's start (status 226 on systemd 245) when the path is missing, so it is made at boot,
# before any unit, not by the API. Install: sudo install -m 0644 this file /etc/tmpfiles.d/shannon-operator-runtime.conf
# then: sudo systemd-tmpfiles --create /etc/tmpfiles.d/shannon-operator-runtime.conf
d /home/azureuser/shannon-ios-data/operator-runtime 0700 azureuser azureuser -
