location ^~ /companion/v1/body/looks/ {
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    limit_req zone=shannon_large_req burst=6 nodelay;
    limit_conn shannon_large_conn 3;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/body/looks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
