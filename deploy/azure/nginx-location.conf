# Add this only to the sh4nnon.com production TLS server block.

# Syzygy ADR-0011 stage 1: the vision worker (shannon-ios-vision) behind the same device tokens. A frame is a JPEG of at most
# 200 KB with its metadata in one header; nothing of a request is logged. Remove this block to take the worker off the network.
location ^~ /companion/v1/vision/ {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:4320/v1/vision/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    access_log off;
}

location ^~ /companion/ {
    # The API applies route-specific limits: ordinary JSON stays at 64 KiB,
    # Agent Host state at 256 KiB, and confirmed camera snapshots at 3 MiB.
    # Keep a small amount of proxy headroom above the largest accepted body.
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:4319/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    # Pairing codes, tokens, and conversations must never enter nginx logs.
    access_log off;
}
