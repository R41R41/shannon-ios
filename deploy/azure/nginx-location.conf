    proxy_send_timeout 30s;
    access_log off;
}

# Her folder on the owner's machines. `claim` (a long poll of up to 25 s) and `binding` are ordinary small requests and are
# never counted; only a step report (at most 640 KiB, hostFolderOperationResults.ts) gets the 1m buffer and the report limits.
location ^~ /companion/v1/autonomy/host-steps/ {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_pass http://127.0.0.1:4319/v1/autonomy/host-steps/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
    location ~ "^/companion/v1/autonomy/host-steps/[0-9a-f-]{36}/report$" {
        client_max_body_size 1m;
        client_body_buffer_size 1m;
        limit_req zone=shannon_report_req burst=8 nodelay;
        limit_conn shannon_report_conn 6;
        limit_req_status 429;
        limit_conn_status 429;
        rewrite ^/companion(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        access_log off;
    }
}

# Everything else: ordinary JSON stays at 64 KiB in the API, Agent Host state and calendar uploads at 256 KiB. No limits here:
# conversation turns, voice streams and long polls are never counted.
location ^~ /companion/ {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_pass http://127.0.0.1:4319/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}
