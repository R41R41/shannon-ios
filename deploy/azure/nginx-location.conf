# Her folder on the owner's machines: a step report of at most 640 KiB (hostFolderOperationResults.ts).
location ^~ /companion/v1/autonomy/host-steps/ {
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    limit_req zone=shannon_large_req burst=6 nodelay;
    limit_conn shannon_large_conn 3;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/autonomy/host-steps/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}

# Everything else: ordinary JSON stays at 64 KiB in the API, Agent Host state and calendar uploads at 256 KiB.
location ^~ /companion/ {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_pass http://127.0.0.1:4319/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    # Pairing codes, tokens, and conversations must never enter nginx logs.
    access_log off;
}
