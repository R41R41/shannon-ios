# Add this only to the sh4nnon.com production TLS server block.
location ^~ /companion/ {
    # The API applies route-specific limits: ordinary JSON stays at 64 KiB,
    # Agent Host state at 256 KiB, and confirmed camera snapshots at 3 MiB.
    # Keep a small amount of proxy headroom above the largest accepted body.
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:4319/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    # Pairing codes, tokens, and conversations must never enter nginx logs.
    access_log off;
}
