    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}

