# Add this only to the sh4nnon.com production TLS server block. The limit zones it names are declared in the http block by
# nginx-http-limits.conf (copy that file to /etc/nginx/conf.d/). Steps: docs/vision-contract.md, "Deploying the nginx change".
#
# No request body may reach the disk (camera frames, photos, voice, her folder's files): every location's body buffer holds the
# largest body it accepts, so nginx never writes one to client_body_temp. Because nginx allocates that buffer before the API has
# checked the device token (a chunked body gets the whole buffer at once), the large buffers are given only to the routes that
# take large bodies, each with request and connection limits of its own kind. All of the owner's devices reach the server from
# one home address, so the limits are per kind of route and sized for several devices; a long poll (her folder's `claim`, its
# `binding`) stays in the ordinary location and is never counted. Her Minecraft body does not come through nginx: its
# companion URL must be loopback (Minebot `companionBaseUrl`), so `/v1/body/minecraft/control` goes to 127.0.0.1:4319 directly.

# Syzygy ADR-0011 stage 1: the vision worker (shannon-ios-vision) behind the same device tokens. A frame is a JPEG of at most
# 160 KB with its metadata in one header, one every 2 s per device. Remove this block to take the worker off the network.
location ^~ /companion/v1/vision/ {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    limit_req zone=shannon_vision_req burst=16 nodelay;
    limit_conn shannon_vision_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4320/v1/vision/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    access_log off;
}

# A photo shared in a call: at most 3 MiB (serverVoiceVisionRoute.ts).
location = /companion/v1/voice/vision/snapshots {
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    limit_req zone=shannon_media_req burst=12 nodelay;
    limit_conn shannon_media_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/voice/vision/snapshots;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}

# Recorded speech for transcription (the API reads up to 5 MiB; nginx keeps the earlier 4 MiB cap).
location = /companion/v1/voice/transcriptions {
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    limit_req zone=shannon_media_req burst=12 nodelay;
    limit_conn shannon_media_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/voice/transcriptions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}

# A look through her body's camera: one frame of at most 400 KB as base64 JSON (bodyLookContract.ts).
location ^~ /companion/v1/body/looks/ {
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    limit_req zone=shannon_look_req burst=8 nodelay;
    limit_conn shannon_look_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/body/looks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    access_log off;
}

# A look through the owner's app: the same frame limit (appLookContract.ts).
location ^~ /companion/v1/app/looks/ {
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    limit_req zone=shannon_look_req burst=8 nodelay;
    limit_conn shannon_look_conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4319/v1/app/looks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_cache off;
